<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>KAIST 영어 면접 훈련</title>
<style>
:root{color-scheme:dark;--bg:#12151b;--card:#1b2029;--fg:#e6e9ef;--mut:#98a2b3;--line:#2c3340;--acc:#6ea0ff;--me:#12301f;--meFg:#4cc38a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "Segoe UI","Malgun Gothic",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px;min-height:100dvh;display:flex;flex-direction:column}
button{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);cursor:pointer}
h1{font-size:19px;margin:4px 0 12px;display:flex;align-items:center;gap:8px}
.chip{font-size:12px;font-weight:400;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.go{display:block;width:100%;text-align:left;margin:8px 0;padding:16px}
.go b{display:block;font-size:18px}.go small{color:var(--mut)}
.go.p{background:var(--acc);border-color:var(--acc);color:#fff}.go.p small{color:#ffffffcc}
h3{margin:20px 0 4px;font-size:14px;color:var(--mut)}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:6px 0}
.item .t{flex:1}.item small{display:block;color:var(--mut);font-size:13px}
.dots{letter-spacing:2px;color:var(--meFg);white-space:nowrap}
.set{color:var(--mut);font-size:14px;margin-top:18px;display:grid;gap:8px}
.set label{display:flex;align-items:center;gap:8px}
/* 훈련 화면 */
.top{display:flex;align-items:center;gap:10px}
.top button{padding:6px 12px}
.pg{flex:1;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.pg i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
#cnt{font-size:13px;color:var(--mut);margin:8px 0 0}
#stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:18px 14px;margin:10px 0;border-radius:18px;border:1px solid var(--line);background:var(--card);transition:background .25s;min-height:300px}
#stage.me{background:var(--me);border-color:var(--meFg)}
.ko{color:var(--mut);font-size:16px}
.en{font-size:27px;line-height:1.35}
.en b{font-weight:650}.dim{opacity:.32}
.hint{font-family:Consolas,monospace;letter-spacing:1px;color:var(--mut);font-size:22px}
.big{font-size:54px;text-align:center}
.you{color:var(--meFg);font-weight:600;font-size:18px}.you small{font-weight:400;opacity:.8;margin-left:6px}
.who{color:var(--mut);font-size:15px}
.gbar{height:8px;border-radius:9px;background:#fff2;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--meFg);animation:g linear forwards}
@keyframes g{from{width:100%}to{width:0}}
.cue{font-size:20px;line-height:1.9;color:var(--mut)}
.ans p{margin:0 0 10px;font-size:19px;line-height:1.4}.ans small{display:block;color:var(--mut);font-size:13px}
.ctl{display:flex;gap:8px;padding-bottom:env(safe-area-inset-bottom)}
.ctl button{flex:1;font-size:20px}
.two{display:flex;gap:8px}.two button{flex:1;font-size:18px;padding:16px 8px}
.ok{background:var(--meFg);border-color:var(--meFg);color:#fff}
#bad{align-self:flex-start}
.mic{height:6px;border-radius:9px;background:#fff1;overflow:hidden}.mic i{display:block;height:100%;width:0;background:var(--acc);transition:width .08s}
.timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:600}
audio{width:100%;height:40px}
/* 전체 원고 */
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.toc a{font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;color:var(--fg);text-decoration:none}
.sc{scroll-margin-top:10px;border-top:1px solid var(--line);padding:4px 0 10px}
.sc p{margin:0;padding:8px 6px;border-radius:8px;cursor:pointer}.sc p.on{background:var(--me)}
.sc small{display:block;color:var(--mut);font-size:14px}
.qq{font-weight:650;color:var(--acc)}.vv{font-size:13px;color:var(--mut);cursor:default!important}
.lines{font-size:16px;line-height:1.55;display:grid;gap:4px}.lines .hint{font-size:16px;letter-spacing:0}.lines .dim{opacity:.45}.lines small{display:block;color:var(--mut);font-size:13px}
.ss{font-size:18px;line-height:1.4}.pa{font-size:15px;color:var(--mut);border-left:3px solid var(--line);margin-left:6px!important}.sl{color:var(--line)}
.noko .sc small{display:none}
</style>
</head>
<body>
<main id="app"></main>
<script>
// ───────── 질문·원고 (여기만 고치면 됨) ─────────
// v: 같은 답으로 이어지는 다른 질문 표현 (면접관은 외운 문장 그대로 묻지 않음)
// s: [영어, 한글]. " / " = 끊어 읽는 자리(한 호흡). 한 문장은 짧게, 같은 문장틀을 여러 답에서 다시 씀.
// 자기소개 (사용자가 직접 쓴 원고, 2026-11-16). " / "만 끊어 읽기용으로 넣음
const INTRO=[
 ['Hello. / My name is Park Junseong.','안녕하세요. 박준성입니다.'],
 ['It\'s nice to meet you.','만나서 반갑습니다.'],
 ['I work on AI policy / for Gimhae City.','김해시에서 AI 정책 일을 합니다.'],
 ['I studied economics / and urban regeneration.','경제학과 도시재생학을 공부했습니다.'],
 ['I\'m especially interested in AX.','특히 AX에 관심이 많습니다.'],
 ['For me, AX means / using AI / to improve traditional industries.','제게 AX는 AI로 전통 산업을 개선하는 것입니다.'],
 ['These days, / I\'m working with Ulsan / on a power semiconductor project.','요즘 울산과 전력반도체 사업을 함께하고 있습니다.'],
 ['I believe / power semiconductors are important / for AI data centers, physical AI, / cars, and ships.','전력반도체는 AI 데이터센터, 피지컬 AI, 자동차, 선박에 중요하다고 생각합니다.'],
 ['In my work, / I bring together universities, research centers, and companies.','일하면서 대학, 연구소, 기업을 한데 모읍니다.'],
 ['I also recently discussed / a research project / with the APEC Climate Center.','최근 APEC 기후센터와 연구 과제도 논의했습니다.'],
 ['I have one important question.','중요한 질문이 하나 있습니다.'],
 ['How can new technology / make people\'s lives better?','새 기술은 어떻게 사람들의 삶을 낫게 할 수 있을까요?'],
 ['That\'s why / I want to study at KAIST.','그래서 KAIST에서 공부하고 싶습니다.'],
 ['Thank you.','감사합니다.']];
// 뜻 덩어리(블록): [끝 문장 번호(미포함), 이름]. 집중 연습은 블록을 하나씩 쌓아 올림
const BLK=[[2,'인사'],[4,'나는 누구'],[6,'AX'],[9,'울산·전력반도체'],[10,'APEC 기후센터'],[14,'질문과 마무리']];
// 교수에게 묻기: 면접 끝 "질문 있습니까?" 때 쓸 질문 3개. a = 예상 교수 답변(지어낸 예시, 듣기 연습용), re = 그 뒤 내 반응
const ASK=[
 {en:'Can I work with climate / or energy researchers here?',ko:'여기서 기후·에너지 연구자들과 함께 연구할 수 있나요?',
  a:'Yes. Future strategy covers many fields, including climate and energy. Many of our students work with people from different fields.',ak:'네. 미래전략은 기후와 에너지를 포함해 여러 분야를 다룹니다. 많은 학생이 다른 분야 사람들과 함께 연구합니다.',
  re:'Thank you. / That is very helpful.',rk:'감사합니다. 큰 도움이 됩니다.'},
 {en:'What do you expect / from students with work experience?',ko:'실무 경력이 있는 학생에게 무엇을 기대하시나요?',
  a:'We hope you bring real problems from your work. Your experience in the field can also help other students learn.',ak:'업무에서 겪은 실제 문제를 가져오길 바랍니다. 현장 경험은 다른 학생들에게도 도움이 됩니다.',
  re:'That is exactly / what I hoped for.',rk:'제가 바라던 바로 그것입니다.'},
 {en:'Can students do joint research / with outside institutes?',ko:'학생이 외부 기관과 공동연구를 할 수 있나요?',
  a:'Yes, that is possible. But first, you should make a clear research plan with your advisor.',ak:'네, 가능합니다. 다만 먼저 지도교수와 명확한 연구계획을 세우세요.',
  re:'I am even more excited now. / Thank you.',rk:'지금 더 기대가 됩니다. 감사합니다.'}];
const Q=[
{id:'intro',t:'자기소개',q:'Please introduce yourself.',qk:'자기소개를 해 주세요.',v:["Tell us about yourself.", "Could you briefly introduce yourself?", "Who are you, and what do you do?"],s:INTRO,b:BLK},
{id:'why',t:'지원 동기',q:'Why did you apply to the Graduate School of Future Strategy?',qk:'왜 미래전략대학원에 지원했습니까?',v:["Why KAIST?", "Why did you choose this program?", "What brought you to this school?"],s:[
 ['I learned one thing / from my work.','일하면서 한 가지를 배웠습니다.'],
 ['Technology, industry, and cities / are all connected.','기술, 산업, 도시는 모두 연결되어 있습니다.'],
 ['Climate is connected too.','기후도 연결되어 있습니다.'],
 ['But policies are divided.','하지만 정책은 나뉘어 있습니다.'],
 ['So I want to study them together.','그래서 이것들을 함께 공부하고 싶습니다.'],
 ['This school is the best place / for that.','이 대학원이 그러기에 가장 좋은 곳입니다.'],
 ['I am really excited / about this school.','이 대학원이 정말 기대됩니다.']]},
{id:'master',t:'박사인데 왜 석사?',q:'You already have a PhD. Why do you want another master\'s degree?',qk:'이미 박사학위가 있는데 왜 석사과정에 지원했습니까?',v:["You have a doctoral degree. Why a master's program?", "Why do you need this degree?", "Isn't a PhD enough?"],s:[
 ['That is a fair question.','당연한 질문입니다.'],
 ['My PhD was about / cities and the economy.','제 박사 연구는 도시와 경제에 관한 것이었습니다.'],
 ['But now / I work on AI and new industries.','하지만 지금은 AI와 신산업 일을 합니다.'],
 ['I need new tools / for this new work.','이 새로운 일에는 새로운 도구가 필요합니다.'],
 ['I am not here / for a degree.','학위 때문에 온 것이 아닙니다.'],
 ['I am here / to learn a new way of thinking.','새로운 사고방식을 배우러 왔습니다.']]},
// 생존 표현 대본: 한글 칸 (괄호) = 이 말을 쓰는 상황
{id:'survive',only:1,t:'생존 표현',q:'Useful phrases',qk:'못 알아들었거나 막혔을 때 쓰는 말',s:[
 ['Sorry, / could you say that again?','(못 알아들었을 때) 죄송합니다, 다시 말씀해 주시겠어요?'],
 ['Could you speak / a little slowly, please?','(말이 너무 빠를 때) 조금 천천히 말씀해 주시겠어요?'],
 ['Sorry, / I can\'t hear you well.','(소리가 잘 안 들릴 때) 죄송합니다, 잘 안 들립니다.'],
 ['Sorry, / what does that word mean?','(모르는 단어가 나왔을 때) 죄송합니다, 그 단어가 무슨 뜻인가요?'],
 ['Do you mean / my research plan?','(질문이 헷갈릴 때) 제 연구계획을 말씀하시는 건가요?'],
 ['That is a good question. / Let me think for a moment.','(생각할 시간이 필요할 때) 좋은 질문입니다. 잠시 생각해 보겠습니다.'],
 ['Sorry, / I am a little nervous. / Let me start again.','(머리가 하얘졌을 때) 죄송합니다, 조금 긴장했네요. 처음부터 다시 하겠습니다.'],
 ['Sorry. / Let me say that again.','(말이 꼬였을 때) 죄송합니다. 다시 말하겠습니다.'],
 ['I don\'t know the English word. / Let me explain it simply.','(영어 단어가 안 떠오를 때) 영어 단어가 생각나지 않네요. 쉽게 설명하겠습니다.'],
 ['I am not sure, / but I will try.','(답이 확실하지 않을 때) 확실하지 않지만 답해 보겠습니다.'],
 ['I don\'t know much about that, / but I want to learn.','(모르는 주제일 때) 그건 잘 모르지만 배우고 싶습니다.'],
 ['In short, / that is my answer.','(답을 끝낼 때) 정리하면, 그게 제 답입니다.'],
 ['Thank you / for your time.','(면접이 끝날 때) 시간 내 주셔서 감사합니다.']]},
// 일상 대화: 면접 시작·끝의 가벼운 대화와 맞장구. 한글 칸의 (영어)가 상대가 묻는 말
{id:'small',only:1,t:'일상 대화·감정 표현',q:'Small talk',qk:'인사, 가벼운 대화, 맞장구',s:[
 ['I am good, thank you. / A little nervous, but excited.','(How are you today?) 좋습니다, 감사합니다. 조금 떨리지만 설레요.'],
 ['Yes, / I can hear you clearly.','(Can you hear me well?) 네, 잘 들립니다.'],
 ['Not really. / I was too excited.','(Did you sleep well?) 별로요. 너무 설렜거든요.'],
 ['Gimhae is a quiet city / near Busan.','(Where is Gimhae?) 김해는 부산 옆 조용한 도시예요.'],
 ['These days, / I practice English every day.','(How are you these days?) 요즘 매일 영어 연습을 해요.'],
 ['Oh, I see. / That makes sense.','아, 그렇군요. 이해가 됩니다.'],
 ['I really like that idea.','그 생각 정말 좋네요.'],
 ['I am really happy / to hear that.','그 말을 들으니 정말 기쁩니다.'],
 ['It was nice / to meet you.','만나서 반가웠습니다.'],
 ['Have a nice day.','좋은 하루 보내세요.']]},
{id:'research',t:'박사 연구',q:'Please tell us about your previous research.',qk:'이전 연구를 소개해 주세요.',v:["What was your PhD research about?", "Tell us about your doctoral thesis.", "What did you study before?"],s:[
 ['I studied suicide risk / in local areas.','지역별 자살 위험을 연구했습니다.'],
 ['I focused on / economic factors.','경제적 요인에 집중했습니다.'],
 ['I found one thing.','한 가지를 발견했습니다.'],
 ['In the same city, / the risk is very different / from area to area.','같은 도시 안에서도 지역마다 위험이 크게 다릅니다.'],
 ['So the problem is / not just personal.','그래서 이 문제는 개인만의 문제가 아닙니다.'],
 ['It comes from / the local economy.','지역 경제에서 비롯됩니다.'],
 ['I proposed a policy / to the National Assembly Research Service.','국회입법조사처에 정책을 제안했습니다.']]},
{id:'study',t:'학업 계획',q:'What do you want to study at KAIST?',qk:'KAIST에서 무엇을 공부하고 싶습니까?',v:["What is your research plan?", "What topic are you interested in?", "What will you research here?"],s:[
 // 연구과제: 기후위기 시대 동남권 AI 데이터센터의 입지 적정성과 지역사회 수용성 연구
 ['My research topic is / AI data centers / in the southeast region.','제 연구 주제는 동남권 AI 데이터센터입니다.'],
 ['That means / Ulsan, Busan, and Gyeongnam.','울산, 부산, 경남입니다.'],
 ['A data center is not just / digital infra.','데이터센터는 단순한 디지털 인프라가 아닙니다.'], // 사용자 선택: infrastructure 대신 infra
 ['It uses / power, water, and land.','전력, 물, 땅을 씁니다.'],
 ['So it is / a new kind of factory.','그래서 새로운 종류의 공장입니다.'],
 ['I will ask / three questions.','세 가지를 묻겠습니다.'],
 ['First, / is there enough power and water?','첫째, 전력과 물이 충분한가?'],
 ['Second, / is it safe from climate risk?','둘째, 기후 위험에 안전한가?'],
 ['Third, / do local people get the benefits?','셋째, 지역 주민이 편익을 얻는가?'],
 ['My goal is / a clear guide / for choosing locations.','목표는 입지를 고르는 명확한 기준입니다.']]},
{id:'dc',t:'왜 이 연구인가',q:'Why is your research important?',qk:'이 연구가 왜 중요합니까?',v:["Tell us more about your data center research.", "What is the problem with AI data centers?", "Why is climate important for data centers?"],s:[
 ['Data centers bring / jobs and taxes.','데이터센터는 일자리와 세수를 가져옵니다.'],
 ['But the region pays / for power, water, and heat.','하지만 전력, 물, 열의 비용은 지역이 냅니다.'],
 ['Climate change / makes this harder.','기후변화가 이를 더 어렵게 만듭니다.'],
 ['Hot days / need more cooling power.','더운 날에는 냉각 전력이 더 필요합니다.'],
 ['Dry years / mean less water.','가뭄이 들면 물이 부족해집니다.'],
 ['A place with enough power today / may not be safe in 2050.','지금 전력이 충분한 곳도 2050년에는 안전하지 않을 수 있습니다.'],
 ['Recently, / I discussed joint research / with the APEC Climate Center.','최근 APEC 기후센터와 공동연구를 논의했습니다.'],
 ['I am not against data centers.','데이터센터에 반대하는 것은 아닙니다.'],
 ['I want to know / what the region gets / and what it pays.','지역이 무엇을 얻고 무엇을 내는지 알고 싶습니다.']]},
{id:'method',t:'연구 방법',q:'How will you do this research?',qk:'이 연구를 어떻게 하겠습니까?',v:["What is your research method?", "What data will you use?", "How will you answer your research question?"],s:[
 ['I will make maps.','지도를 만들겠습니다.'],
 ['I will put climate risk / on top of possible sites.','후보지 위에 기후 위험을 겹쳐 보겠습니다.'],
 ['I will use climate data / for 2030 and 2050.','2030년과 2050년 기후 자료를 쓰겠습니다.'],
 ['I will also check / power, water, and jobs.','전력, 물, 일자리도 살펴보겠습니다.'],
 ['And I will ask / local people.','그리고 지역 주민에게 묻겠습니다.']]},

Q.sort((a,b)=>ORDER.indexOf(a.id)-ORDER.indexOf(b.id));

// ───────── 상태 ─────────
const $=s=>document.querySelector(s),app=$('#app');
const S=JSON.parse(localStorage.kaistInterview2||'{}');
const save=()=>localStorage.kaistInterview2=JSON.stringify(S);
const lv=q=>S['c_'+q.id]||0; // 0=아직, 1=외움(복습 남음), 2=복습 통과
const setLv=(q,n)=>{S['c_'+q.id]=n;save()};
const rate=()=>+S._rate||0.75;
const pad=()=>+S._pad||2.2; // 말할 시간 배수. 다 말했으면 화면을 탭해 넘기면 되므로 넉넉하게
const clean=en=>en.replace(/ \/ /g,' ');
const words=t=>t.split(/\s+/).length;
const hint=t=>t.split(' ').map(w=>w[0]+w.slice(1).replace(/[A-Za-z]/g,'·')).join(' '); // 첫 글자만 남김
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,r)=>p[0]-r[0]).map(x=>x[1]);

// ───────── 읽어주기 ─────────
let sayId=0,wd,lt,tm,wl,mr,chunks,stream;
function say(text,onend,vary){ // vary: 목소리·속도를 무작위로 (실전은 늘 다른 사람이 물음)
  speechSynthesis.cancel();clearTimeout(wd);const id=++sayId;
  const fin=()=>{if(id!==sayId)return;sayId++;clearTimeout(wd);onend&&onend()};
  const vs=speechSynthesis.getVoices().filter(v=>v.lang.replace('_','-').startsWith('en'));
  const us=vs.filter(v=>/en.US/.test(v.lang)),voice=vary&&vs.length?vs[Math.floor(Math.random()*vs.length)]:us.find(v=>/Google|Natural|Samantha|Aria|Jenny/.test(v.name))||us[0]||vs[0];
  const u=new SpeechSynthesisUtterance(text);u.lang='en-US';if(voice)u.voice=voice;u.rate=rate()*(vary?.9+Math.random()*.3:1);u.onend=u.onerror=fin;
  speechSynthesis.speak(u);
  wd=setTimeout(fin,(words(text)*700+4000)/rate()); // 일부 휴대폰은 끝났다는 신호를 안 줌 → 시간으로 넘김
}
speechSynthesis.getVoices();
const later=(f,ms)=>{clearTimeout(lt);lt=setTimeout(f,ms)};
// ───────── 말 끝 감지: 소리 크기만 봄. 음성은 기기 밖으로 나가지 않음 ─────────
// ponytail: 아이폰은 마이크가 켜져 있는 동안 읽어 주는 소리가 작아질 수 있음. 심하면 단계마다 마이크를 껐다 켜기
let AC,vad=null,vadErr='',heard=null,lr;
const vadOn=()=>S._vad!==false;
function micOn(){if(!vadOn()||vad||!navigator.mediaDevices)return;
  AC=AC||new AudioContext();AC.resume(); // 버튼을 누른 순간에 만들어야 아이폰에서 동작
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(st=>{
    if(!P)return st.getTracks().forEach(t=>t.stop());
    const an=AC.createAnalyser();an.fftSize=1024;AC.createMediaStreamSource(st).connect(an);vad={st,an,buf:new Float32Array(1024)};vadErr=''
  }).catch(e=>vadErr=micErr(e))}
function micOff(){vad&&vad.st.getTracks().forEach(t=>t.stop());vad=null}
// 주변 소음(floor)은 조용할 땐 바로 내려가고 시끄러우면 천천히 올라감 → 바로 말을 시작해도 목소리를 소음으로 착각하지 않음
// 소음의 3배 넘는 소리가 0.3초 넘게 난 뒤 1.2초 조용하면 "다 말함"
function vadTick(st,v,now){st.floor=v<st.floor?v:st.floor*.998+v*.002;
  if(v>Math.max(.015,st.floor*3)){st.spoke=st.spoke||now;st.quiet=now}
  return st.spoke&&st.quiet-st.spoke>300&&now-st.quiet>(st.need||1200)?1:0}
function hear(go,need){if(!vad)return;const st={floor:.01,spoke:0,quiet:0,need}; // need: 끝으로 볼 침묵(ms). 긴 암송은 생각할 틈을 줘야 해서 길게
  const f=()=>{vad.an.getFloatTimeDomainData(vad.buf);let s=0;for(const x of vad.buf)s+=x*x;const v=Math.sqrt(s/vad.buf.length),b=$('#lv');
    b&&(b.style.width=Math.min(100,v*400)+'%');if(vadTick(st,v,Date.now()))return go();if(st.spoke)heard=true;lr=requestAnimationFrame(f)};f()}
let ptok=0;
function halt(){ptok++;const sg=$('#stage');sg&&(sg.onclick=null);cancelAnimationFrame(lr);clearTimeout(lt);clearTimeout(wd);clearInterval(tm);sayId++;speechSynthesis.cancel();if(mr&&mr.state!=='inactive'){mr.onstop=null;mr.stop()}stream&&stream.getTracks().forEach(t=>t.stop())}
const micErr=e=>({NotAllowedError:'브라우저가 마이크를 막았습니다. 주소창 왼쪽 자물쇠 → 마이크 → 허용',NotFoundError:'마이크를 찾지 못했습니다',NotReadableError:'다른 프로그램(줌·팀즈 등)이 마이크를 쓰고 있습니다'}[e.name]||e.name+': '+e.message);
// 마이크 확인: 10초 동안 소리 크기 막대와 쓰는 마이크 이름을 보여 줌
function micTest(out){
  navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{
    const ac=new AudioContext(),an=ac.createAnalyser(),buf=new Uint8Array(an.fftSize),t0=Date.now();ac.createMediaStreamSource(st).connect(an);
    out.innerHTML=`🎙 ${st.getAudioTracks()[0].label} — 말해 보세요<div class="gbar"><i id="lvl" style="animation:none;width:0"></i></div>`;
    let peak=0;const tick=()=>{an.getByteTimeDomainData(buf);const v=Math.max(...buf.map(x=>Math.abs(x-128)))/128;peak=Math.max(peak,v);
      const b=$('#lvl');if(b&&Date.now()-t0<1e4){b.style.width=Math.min(100,v*250)+'%';return requestAnimationFrame(tick)}
      st.getTracks().forEach(t=>t.stop());ac.close();
      if(out.isConnected)out.textContent=peak>.05?'✔ 마이크 정상 입력':'✖ 소리가 안 들어옵니다. Windows 소리 설정 → 입력 장치를 확인하세요'};tick()
  }).catch(e=>out.textContent='✖ '+micErr(e))}
const awake=()=>navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wl=w).catch(()=>{}); // 훈련 중 화면 꺼짐 방지
document.addEventListener('visibilitychange',()=>{if(P&&!document.hidden)awake()});

// ───────── 진행기: 단계 목록을 받아 알아서 넘김 ─────────
// 단계 = {tag, html, say?, gap?(true=읽은 시간만큼 / 숫자 ms), rest?, wait?(next)}
let P=null;
function run(steps,onDone){
  P={steps,i:0,onDone,paused:false};awake();micOn();
  app.innerHTML=`<div class="top"><button onclick="quit()">✕</button><div class="pg"><i id="pgb"></i></div></div><div id="cnt"></div>
    <div id="stage"></div><div class="ctl"><button onclick="mv(-1)">⏮</button><button id="pp" onclick="pause()">⏸</button><button onclick="mv(1)">⏭</button></div>`;
  show();
}
function show(){
  halt();const s=P.steps[P.i];
  if(!s){const d=P.onDone;P=null;micOff();wl&&wl.release();return d?d():home()}
  $('#pgb').style.width=P.i/P.steps.length*100+'%';
  const stage=$('#stage'),next=()=>{P.i++;show()};
  if(P.paused)return paint(s,stage);
  s.wait?(paint(s,stage),s.wait(next,stage)):play(s,stage,next);
}
function paint(s,stage){$('#cnt').textContent=s.tag;stage.className='';stage.onclick=null;stage.innerHTML=s.html}
function play(s,stage,next){ // 한 단계: 보여 주고 → 읽어 주고 → 말할 틈을 준 뒤 next
  paint(s,stage);const t=Date.now(),k=++ptok; // k: 이 단계의 번호. 화면 탭·시간 끝·말 끝이 겹쳐도, 일시정지 뒤에도 옛 단계는 다음으로 못 넘김
  const gap=()=>{if(k!==ptok)return;
    const ms=(s.gap===true?(Date.now()-t)*1.5+1000:s.gap)*pad();
    if(!ms)return later(next,s.rest||350);
    const go=()=>{if(k!==ptok)return;ptok++;cancelAnimationFrame(lr);clearTimeout(lt);stage.onclick=null;next()};
    stage.className='me';stage.onclick=go;heard=vad?false:null;
    stage.insertAdjacentHTML('beforeend',`<div class="you">🗣 지금 말하세요<small>${vad?'말이 끝나면 자동으로 넘어감':vadOn()&&vadErr?'🎙 '+vadErr:'다 말했으면 화면 탭'}</small></div>${vad?'<div class="mic"><i id="lv"></i></div>':''}<div class="gbar"><i style="animation-duration:${ms}ms"></i></div>`);
    later(go,ms);hear(go,s.quiet)};
  if(s.say){stage.insertAdjacentHTML('afterbegin','<div class="who">👂 듣기</div>');say(s.say,()=>{const w=stage.querySelector('.who');w&&w.remove();gap()},s.vary)}else gap();
}
function mv(d){P.paused=false;$('#pp').textContent='⏸';P.i=Math.min(P.steps.length-1,Math.max(0,P.i+d));show()}
function pause(){P.paused=!P.paused;$('#pp').textContent=P.paused?'▶':'⏸';P.paused?halt():show()}
function quit(){halt();P=null;micOff();wl&&wl.release();home()}

// ───────── 단계 만들기 ─────────
// 모든 답을 같은 순서로 외움 (learn):
//  1) 🗺 흐름: 한글로 무슨 말을 어떤 순서로 하는지 먼저 봄 (뜻을 알고 외워야 오래 감)
//  2) 블록 쌓기: 2~3문장씩 듣고 따라 한 뒤, 매번 "처음부터 여기까지" 안 보고 말함. 앞 블록은 힌트를 줄임(사라지는 단서)
//  3) 통째로: 덩이 첫 단어 힌트 → 한글만 → 실전(질문만 듣고)
// 복습(review): 새 답 3개를 외울 때마다 "다음" 버튼이 외운 답을 질문만으로 다시 묻게 함. 😀면 ●
const H=(en,ko)=>`<div class="ko">${ko}</div><div class="en">${en}</div>`;
// 듣고 따라 하기 (한 문장): 끊어서 한 덩이씩 → 문장 통째로
function echo1(q,k,tag){const[en,ko]=q.s[k],cs=en.split(' / '),full=cs.join(' '),out=[];
  if(cs.length>1)cs.forEach((c,j)=>out.push({tag,say:c,gap:true,html:H(cs.map((x,m)=>m===j?`<b>${x}</b>`:`<span class="dim">${x}</span>`).join(' '),ko)}));
  out.push({tag,say:full,gap:true,html:H(`<b>${full}</b>`,ko)});return out}
// 사라지는 단서(Glisky·Schacter·Tulving 1986): 0=모든 단어 첫 글자, 1=덩이 첫 단어만, 2=힌트 없음
const cue=(en,n)=>`<span class="hint">${n>=2?'(힌트 없음)':n?en.split(' / ').map(c=>c.split(' ').map((w,i)=>i?w.replace(/[A-Za-z]/g,'·'):w).join(' ')).join(' '):hint(clean(en))}</span>`;
const all=(q,n=q.s.length)=>clean(q.s.slice(0,n).map(x=>x[0]).join(' '));
const recite=(q,n)=>(words(all(q,n))*550+1800*n)/rate();
// 블록: 자기소개는 뜻 덩어리(b), 나머지는 2~3문장씩 고르게
const blocks=q=>q.b||(k=>Array.from({length:k},(_,i)=>[Math.round(q.s.length*(i+1)/k),'']))(Math.ceil(q.s.length/3));
// 외울 때 보이는 줄: 새 문장은 힌트+한글, 앞 문장은 힌트만, lvOf≥2면 한글만
const lines=(q,n,lvOf)=>`<div class="lines">${q.s.slice(0,n).map(([en,ko],k)=>`<div>${lvOf(k)>=2?ko:cue(en,lvOf(k))+(lvOf(k)?'':`<small>${ko}</small>`)}</div>`).join('')}</div>`;
const full=(q,n,from=0)=>`<div class="lines">${q.s.slice(0,n).map(([en],k)=>`<div${k<from?' class="dim"':''}>${clean(en)}</div>`).join('')}</div>`;
function learn(q){const B=blocks(q),N=q.s.length,tag=t=>`${q.t} · ${t}`;let a=0;return[
  {tag:tag('🗺 흐름'),rest:3000+N*1500,html:`<div class="who">🗺 뜻 흐름부터 — 무슨 말을 어떤 순서로 하는지</div><div class="ko">Q. ${q.qk}</div><div class="lines">${B.map(([e,name],b)=>`<div><b>${b+1}${name?'. '+name:''}</b> ${q.s.slice(b?B[b-1][0]:0,e).map(x=>x[1]).join(' ')}</div>`).join('')}</div>`},
  ...B.flatMap(([e,name],b)=>{const s=a;a=e;const t=tag(`블록 ${b+1}/${B.length}${name?' '+name:''}`);return[
    ...q.s.slice(s,e).flatMap((_,j)=>echo1(q,s+j,t)),
    ...q.only?quick(q,q.s.slice(s,e)):[ // 표현 모음은 서로 이어진 글이 아니라 상황 보고 바로 말하기만
    {tag:t+' · 처음부터 여기까지',gap:recite(q,e),quiet:3000,html:'<div class="who">🔁 처음부터 여기까지 안 보고 말하기</div>'+lines(q,e,k=>k<s?1:0)},
    {tag:t+' · 확인',say:all(q,e),rest:800,html:full(q,e,s)}]]}),
  ...q.only?[]:[{tag:tag('통째로 ① 첫 단어'),gap:recite(q,N),quiet:3000,html:'<div class="who">🔁 처음부터 끝까지</div>'+lines(q,N,()=>1)},
  {tag:tag('통째로 ① 확인'),say:all(q),rest:800,html:full(q,N)},
  {tag:tag('통째로 ② 한글만'),gap:recite(q,N),quiet:3000,html:'<div class="who">🔁 한글만 보고 처음부터 끝까지</div>'+lines(q,N,()=>2)}],
  ...test(q,true)]}
// 판정: 외우는 중엔 😀/😵 모두 ◐(복습 남음), 복습·모의면접에서 😀면 ●, 😵면 ◐로
const mark=(q,ok,learning)=>setLv(q,ok&&!learning?2:1);
const judge=(q,learning)=>({tag:q.t+' · 판정',html:'<div class="ko">막힘없이 말했나요?</div><div class="two"><button id="no">😵 아직</button><button class="ok" id="yes">😀 됐다</button></div>',
  wait:next=>{$('#no').onclick=()=>{mark(q,0,learning);next()};$('#yes').onclick=()=>{mark(q,1,learning);next()}}});
// 상황 보고 바로 말하기: 한글 (괄호)의 영어는 상대가 하는 말이라 소리로 들려줌
const quick=(q,list)=>list.flatMap(([en,ko])=>{const m=ko.match(/^\(([A-Za-z][^)]*)\)/),f=clean(en),tag=q.t+' · 상황 보고 바로 말하기';
  return[{tag,say:m&&m[1],vary:true,gap:(words(f)*550+1800)/rate(),html:H(cue(en,2),ko)},{tag,say:f,rest:700,html:H(`<b>${f}</b>`,ko)}]});
// 시험: 답변은 질문 듣고 통째로, 표현 모음은 상황(또는 상대 말)만 보고 바로, 교수에게 묻기는 역할극
function test(q,learning){
  if(q.id==='ask')return[...askPlay(learning?ASK:[ASK[Math.random()*ASK.length|0]]),judge(q,learning)];
  if(q.only)return[...quick(q,shuffle(q.s)),judge(q,learning)];
  return whole(q,!learning,learning)}
// 질문 듣고 통째로: 시간 재고 → 모범답안·녹음과 비교 → 스스로 판정
function whole(q,vary,learning){const tag=`${q.t} · ${learning?'통째로 ③ 실전':'질문 듣고 답하기'}`,ask=vary&&q.v?q.v[Math.random()*q.v.length|0]:q.q;return[
  {tag,say:ask,vary,rest:200,html:`<div class="big">🔊</div><div class="ko" style="text-align:center">질문을 들으세요</div>`},
  {tag,html:'',wait:(next,stage)=>{
    const goal=Math.round(words(all(q))/90*60),t0=Date.now(); // 목표: 분당 90단어
    stage.className='me';
    stage.innerHTML=`<div class="ko">Q. ${ask===q.q?q.qk:ask}</div><details><summary class="ko">💡 막히면 첫마디 보기</summary><div class="cue">${q.s.map(x=>clean(x[0]).split(' ').slice(0,2).join(' ')+' …').join('<br>')}</div></details>
      <div class="you">🗣 답변하세요 <span class="timer" id="tm">0</span>초 <small>목표 ${goal}초</small></div><div class="gbar"><i style="animation-duration:${goal}s"></i></div>
      <div class="two"><button id="again">🔊 질문 다시</button><button class="ok" id="fin">다 말했다</button></div>`;
    $('#again').onclick=()=>say(ask,null,vary);
    tm=setInterval(()=>{const e=$('#tm');e&&(e.textContent=Math.floor((Date.now()-t0)/1000))},250);
    if(S._rec)navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{stream=st;chunks=[];mr=new MediaRecorder(st);mr.ondataavailable=e=>chunks.push(e.data);mr.start()}).catch(e=>{const y=stage.querySelector('.you');y&&y.insertAdjacentHTML('afterend',`<div class="ko">🎙 녹음 안 됨 — ${micErr(e)}</div>`)});
    $('#fin').onclick=()=>{
      const sec=Math.round((Date.now()-t0)/1000);clearInterval(tm);stage.className='';
      stage.innerHTML=`<div class="ko">Q. ${ask}</div><div class="${sec<=goal?'you':'ko'}">${sec<=goal?'✔':'⏱'} 내 답변 ${sec}초 · 목표 ${goal}초${sec<=goal?'':' (넘김)'}</div><div id="au"></div><div class="ans">${q.s.map(x=>`<p>${clean(x[0])}<small>${x[1]}</small></p>`).join('')}</div>
        <button id="mdl">▶ 모범답안 듣기</button><div class="two"><button id="no">😵 아직</button><button class="ok" id="yes">😀 됐다</button></div>`;
      if(mr&&mr.state!=='inactive'){mr.onstop=()=>{const a=$('#au');a&&(a.innerHTML=`<audio controls src="${URL.createObjectURL(new Blob(chunks,{type:mr.mimeType}))}"></audio>`);stream.getTracks().forEach(t=>t.stop())};mr.stop()}
      $('#mdl').onclick=()=>say(all(q));
      $('#no').onclick=()=>{mark(q,0,learning);next()};$('#yes').onclick=()=>{mark(q,1,learning);next()};
    }}}]}
// 교수에게 묻기 역할극: 면접관 "질문 있나요?" → 내가 묻기 → 모범 질문 → 교수 답변(다른 목소리) → 내 반응
const askPlay=list=>list.flatMap((x,i)=>{const tag=`교수에게 묻기 ${i+1}/${list.length}`,t=y=>(words(clean(y))*550+1800)/rate();return[
  {tag,say:i?'Do you have any other questions?':'Do you have any questions for us?',vary:true,rest:300,html:`<div class="big">🙋</div><div class="ko" style="text-align:center">면접관: ${i?'다른 질문 있습니까?':'질문 있습니까?'}</div>`},
  {tag,gap:t(x.en),html:'<div class="who">❓ 내가 묻기</div>'+H(cue(x.en,0),x.ko)},
  {tag,say:clean(x.en),rest:500,html:H(`<b>${clean(x.en)}</b>`,x.ko)},
  {tag,say:x.a,vary:true,rest:800,html:`<div class="who">👨‍🏫 교수 답변 (예시)</div><div class="en" style="font-size:20px">${x.a}</div><div class="ko">${x.ak}</div>`},
  {tag,gap:t(x.re),html:'<div class="who">💬 내 반응</div>'+H(cue(x.re,0),x.rk)},
  {tag,say:clean(x.re),rest:800,html:H(`<b>${clean(x.re)}</b>`,x.rk)}]});
// 모의면접: 인사·자기소개 먼저, 가운데는 섞고, 질문하기·마지막 한마디로 끝. 질문은 변형 표현·다른 목소리
function mock(cards){const head=cards.filter(q=>q.id==='small'||q.id==='intro'),end=cards.filter(q=>q.id==='ask'||q.id==='closing');
  return[...head,...shuffle(cards.filter(q=>!head.includes(q)&&!end.includes(q))),...end].flatMap(q=>test(q,false))}
// "다음" 버튼: 새 답 3개마다 복습, 아니면 다음 새 답, 다 외웠으면 모의면접
const learned=()=>Q.filter(q=>lv(q)===1);
function nextUp(){const r=learned(),fresh=Q.find(q=>!lv(q));
  if(r.length&&((S._since||0)>=3||!fresh))return{t:'🔁 복습: '+r.map(q=>q.t).join(', '),go:()=>run(mock(r),()=>{S._since=0;save();home()})};
  if(fresh)return{t:`📘 ${Q.indexOf(fresh)+1}. ${fresh.t} 외우기`,go:()=>learnOne(fresh)};
  return{t:'🎤 다 외웠습니다 — 모의면접',go:()=>run(mock(Q))}}
const learnOne=q=>run(learn(q),()=>{S._since=(S._since||0)+1;save();home()});
// 예상 시간(분): 읽어 주는 시간 + 따라 하기 + 암송(말 끝 감지로 보통 최대 시간보다 일찍 끝남) + 판정
const tts=t=>words(t)*.3/rate()+.5;
const mins=steps=>steps.reduce((a,s)=>a+(s.say?tts(s.say):0)+(s.gap===true?tts(s.say)*1.5*pad()+1:s.gap?s.gap/1000:0)+(s.rest||0)/1000+(s.wait?40:0),0)/60;

console.assert(Q.every(q=>q.only||q.v.length>=3),'질문 변형 3개씩');
console.assert(Q.map(q=>q.id).join()===ORDER.join(),'면접 흐름 순서 = ORDER, 빠진 답 없음');
console.assert(hint('I am.')==='I a·.','hint');
console.assert(echo1({s:[['a / b','x']]},0).length===3,'echo1: 덩이 2 + 문장 1');
console.assert(cue('I work / at home.',1).includes('I ···· at ····.')&&cue('a',2).includes('힌트 없음'),'cue: 단서 소거');
console.assert(blocks({s:Array(7)}).map(x=>x[0]).join()==='2,5,7'&&blocks({s:Array(10)}).length===4,'blocks: 2~3문장씩');
console.assert(INTRO.length===BLK[BLK.length-1][0]&&blocks(Q[1])===BLK,'자기소개 블록');
for(const s0 of[300,0]){const st={floor:.01,spoke:0,quiet:0},v=t=>t>=s0&&t<s0+700?.1:.005;let end=0; // (소음 →) 0.7초 말함 → 조용
 for(let t=0;t<4000&&!end;t+=16)end=vadTick(st,v(t),t)&&t;console.assert(end>s0+1900&&end<s0+2000,'vadTick: 말 끝나고 1.2초 뒤 넘김',s0,end)}
console.assert(askPlay(ASK).length===18&&test(Q.find(q=>q.id==='ask'),false).length===7,'교수에게 묻기: 3개 × 6단계, 복습은 1개 + 판정');
console.assert(test(Q[0],false).length===Q[0].s.length*2+1&&whole(Q[1],true).length===2,'test: 표현 모음 상황 2단계씩 + 판정, 답변은 통째로');
console.assert(mins(learn(Q[1]))>10&&mins(learn(Q[1]))<40,'자기소개 외우기 10~40분',mins(learn(Q[1])));
console.assert(Q.every(q=>q.s.every(x=>x[0].split(' / ').every(c=>words(c)<=8))),'한 덩이 8단어 이하');

// ───────── 첫 화면 ─────────
function home(){
  halt();
  const d=Math.ceil((new Date('2026-11-18T00:00:00+09:00')-Date.now())/864e5),n=nextUp();
  const left=Q.filter(q=>!lv(q)).reduce((a,q)=>a+mins(learn(q)),0);
  app.innerHTML=`<h1>KAIST 영어 면접 <span class="chip">${d>0?'D-'+d:d===0?'당일':'종료'}</span><span class="chip">● ${Q.filter(q=>lv(q)===2).length}/${Q.length}</span></h1>
    <button class="go p" id="b1"><b>▶ ${n.t}</b><small>이 버튼만 계속 누르세요 · 새 답 3개마다 복습이 자동으로 끼어듦 · 남은 외우기 약 ${Math.round(left)}분</small></button>
    <button class="go" id="b2"><b>🎤 모의면접 전체</b><small>외운 답 전부 · 질문만 듣고 답하기 · 자기 전과 면접 날 아침에</small></button>
    <button class="go" id="b4"><b>📄 전체 원고</b><small>모든 질문과 답 · 처음부터 다 듣기 · 생존 표현 대본</small></button>
    <h3>면접 흐름 — 위에서부터 순서대로 외움 · 누르면 그 답만 다시</h3>
    ${Q.map((q,i)=>`<button class="item" data-id="${q.id}"><span class="t">${i+1}. ${q.t}<small>${q.qk} · ${Math.round(mins(learn(q)))}분</small></span><span class="dots">${'○◐●'[lv(q)]}</span></button>`).join('')}
    <div class="set"><span>○ 아직 · ◐ 외움(복습 남음) · ● 복습 통과</span>
    <label>읽는 속도 <input id="rate" type="range" min="0.6" max="1.1" step="0.05" value="${rate()}"><span id="rv">${rate()}배</span></label>
    <label>말할 시간 <input id="pad" type="range" min="1" max="3" step="0.2" value="${pad()}"><span id="pv">${pad()}배</span></label>
    <label><input id="rec" type="checkbox" ${S._rec?'checked':''}> 통째로 말할 때 내 목소리 녹음해서 들려주기 (마이크 허용 필요)</label>
    <label><input id="vad" type="checkbox" ${vadOn()?'checked':''}> 🎙 말이 끝나면 자동으로 넘김 (소리 크기만 봄 · 음성은 기기 밖으로 안 나감)</label>
    <button id="mic">🎙 마이크 확인</button><span id="micout"></span>
    <details><summary>이 훈련법의 근거 (연구 논문)</summary><ul style="padding-left:18px;margin:6px 0">
    <li><b>다시 읽지 않고 안 보고 말하기</b> — Roediger &amp; Karpicke (2006). Test-enhanced learning. <i>Psychological Science, 17</i>(3), 249–255.</li>
    <li><b>외울수록 힌트가 사라짐</b> — Glisky, Schacter &amp; Tulving (1986). Learning and retention of computer-related vocabulary in memory-impaired patients: Method of vanishing cues. <i>Journal of Clinical and Experimental Neuropsychology, 8</i>(3), 292–312.</li>
    <li><b>시간을 두고 다시 꺼내기 (새 답 3개마다 복습, 자기 전·다음 날 아침 모의면접)</b> — Cepeda, Pashler, Vul, Wixted &amp; Rohrer (2006). Distributed practice in verbal recall tasks. <i>Psychological Bulletin, 132</i>(3), 354–380.</li>
    <li><b>소리 내어 말하기</b> — MacLeod, Gopie, Hourihan, Neary &amp; Ozubko (2010). The production effect. <i>Journal of Experimental Psychology: Learning, Memory, and Cognition, 36</i>(3), 671–685.</li>
    <li><b>같은 답을 목표 시간 안에</b> — Nation (1989). Improving speaking fluency. <i>System, 17</i>(3), 377–384.</li>
    <li><b>복습 때 질문을 실전처럼 바꿔 듣기</b> — Morris, Bransford &amp; Franks (1977). Levels of processing versus transfer appropriate processing. <i>Journal of Verbal Learning and Verbal Behavior, 16</i>(5), 519–533.</li>
    </ul></details></div>`;
  $('#b1').onclick=n.go;
  $('#b2').onclick=()=>{const L=Q.filter(lv);run(mock(L.length?L:Q))};
  $('#b4').onclick=script;
  app.querySelectorAll('.item').forEach(b=>b.onclick=()=>learnOne(Q.find(q=>q.id===b.dataset.id)));
  $('#rate').oninput=e=>{S._rate=e.target.value;save();$('#rv').textContent=e.target.value+'배'};
  $('#pad').oninput=e=>{S._pad=e.target.value;save();$('#pv').textContent=e.target.value+'배'};
  $('#vad').onchange=e=>{S._vad=e.target.checked;save()};
  $('#mic').onclick=()=>micTest($('#micout'));
  $('#rec').onchange=e=>{S._rec=e.target.checked;save()};
}
// 전체 원고: 면접 흐름 순서. 문장을 누르면 그 문장만, ▶ 전체 듣기는 마지막에 누른 곳부터 끝까지 이어서 읽음
function script(){
  halt();scrollTo(0,0);let chain=0,from=0;
  app.innerHTML=`<div class="top"><button id="back">←</button><b style="flex:1">전체 원고</b><button id="all">▶ 전체 듣기</button><label class="set" style="margin:0"><input id="ko" type="checkbox" checked> 한글</label></div>
    <nav class="toc">${Q.map((q,i)=>`<a href="#s-${q.id}">${i+1}. ${q.t}</a>`).join('')}</nav>
    ${Q.map((q,i)=>`<section class="sc" id="s-${q.id}"><h3>${i+1}. ${q.t}</h3><p class="qq" data-say="${q.q}">Q. ${q.q}<small>${q.qk}</small></p>
      ${q.v?`<p class="vv">비슷한 질문: ${q.v.join(' · ')}</p>`:''}${q.id==='survive'?'<p class="vv">(괄호) = 이 말을 쓰는 상황</p>':''}
      ${q.s.map(([en,ko],k)=>`<p class="ss" data-say="${clean(en).replace(/"/g,'&quot;')}">${en.split(' / ').join(' <span class="sl">/</span> ')}<small>${ko}</small></p>`
        +(q.id==='ask'&&k%2===0?`<p class="pa" data-say="${ASK[k/2].a}">👨‍🏫 ${ASK[k/2].a}<small>${ASK[k/2].ak} (예상 답변)</small></p>`:'')).join('')}</section>`).join('')}
    <button class="go" id="back2">← 처음으로</button>`;
  const ps=[...app.querySelectorAll('[data-say]')],btn=$('#all');
  const stop=()=>{chain=0;halt();btn.textContent='▶ 전체 듣기';app.querySelectorAll('.on').forEach(x=>x.classList.remove('on'))};
  const read=i=>{app.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));const p=ps[i];if(!p){from=0;return stop()}from=i;
    p.classList.add('on');chain&&p.scrollIntoView({block:'center',behavior:'smooth'});say(p.dataset.say,()=>{p.classList.remove('on');chain&&read(i+1)})};
  btn.onclick=()=>chain?stop():(chain=1,btn.textContent='⏹ 멈춤',read(from));
  ps.forEach((p,i)=>p.onclick=()=>{chain=0;btn.textContent='▶ 전체 듣기';read(i)});
  $('#back').onclick=$('#back2').onclick=()=>{stop();app.classList.remove('noko');home();scrollTo(0,0)};
  $('#ko').onchange=e=>app.classList.toggle('noko',!e.target.checked);
}
home();
</script>
</body>
</html>
