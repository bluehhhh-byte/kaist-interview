<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>KAIST 영어 면접 훈련</title>
<style>
:root{color-scheme:dark;--bg:#12151b;--card:#1b2029;--fg:#e6e9ef;--mut:#98a2b3;--line:#2c3340;--acc:#6ea0ff;--me:#12301f;--meFg:#4cc38a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "Segoe UI","Malgun Gothic",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px;min-height:100dvh;display:flex;flex-direction:column}
button{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);cursor:pointer}
h1{font-size:19px;margin:4px 0 12px;display:flex;align-items:center;gap:8px}
.chip{font-size:12px;font-weight:400;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.go{display:block;width:100%;text-align:left;margin:8px 0;padding:16px}
.go b{display:block;font-size:18px}.go small{color:var(--mut)}
.go.p{background:var(--acc);border-color:var(--acc);color:#fff}.go.p small{color:#ffffffcc}
h3{margin:20px 0 4px;font-size:14px;color:var(--mut)}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:6px 0}
.item .t{flex:1}.item small{display:block;color:var(--mut);font-size:13px}
.dots{letter-spacing:2px;color:var(--meFg);white-space:nowrap}
.set{color:var(--mut);font-size:14px;margin-top:18px;display:grid;gap:8px}
.set label{display:flex;align-items:center;gap:8px}
/* 훈련 화면 */
.top{display:flex;align-items:center;gap:10px}
.top button{padding:6px 12px}
.pg{flex:1;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.pg i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
#cnt{font-size:13px;color:var(--mut);margin:8px 0 0}
#stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:18px 14px;margin:10px 0;border-radius:18px;border:1px solid var(--line);background:var(--card);transition:background .25s;min-height:300px}
#stage.me{background:var(--me);border-color:var(--meFg)}
.ko{color:var(--mut);font-size:16px}
.en{font-size:27px;line-height:1.35}
.en b{font-weight:650}.dim{opacity:.32}
.hint{font-family:Consolas,monospace;letter-spacing:1px;color:var(--mut);font-size:22px}
.big{font-size:54px;text-align:center}
.you{color:var(--meFg);font-weight:600;font-size:18px}.you small{font-weight:400;opacity:.8;margin-left:6px}
.who{color:var(--mut);font-size:15px}
.gbar{height:8px;border-radius:9px;background:#fff2;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--meFg);animation:g linear forwards}
@keyframes g{from{width:100%}to{width:0}}
.cue{font-size:20px;line-height:1.9;color:var(--mut)}
.ans p{margin:0 0 10px;font-size:19px;line-height:1.4}.ans small{display:block;color:var(--mut);font-size:13px}
.ctl{display:flex;gap:8px;padding-bottom:env(safe-area-inset-bottom)}
.ctl button{flex:1;font-size:20px}
.two{display:flex;gap:8px}.two button{flex:1;font-size:18px;padding:16px 8px}
.ok{background:var(--meFg);border-color:var(--meFg);color:#fff}
#bad{align-self:flex-start}
.mic{height:6px;border-radius:9px;background:#fff1;overflow:hidden}.mic i{display:block;height:100%;width:0;background:var(--acc);transition:width .08s}
.timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:600}
audio{width:100%;height:40px}
/* 전체 원고 */
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.toc a{font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;color:var(--fg);text-decoration:none}
.sc{scroll-margin-top:10px;border-top:1px solid var(--line);padding:4px 0 10px}
.sc p{margin:0;padding:8px 6px;border-radius:8px;cursor:pointer}.sc p.on{background:var(--me)}
.sc small{display:block;color:var(--mut);font-size:14px}
.qq{font-weight:650;color:var(--acc)}.vv{font-size:13px;color:var(--mut);cursor:default!important}
.ss{font-size:18px;line-height:1.4}.sl{color:var(--line)}
.noko .sc small{display:none}
</style>
</head>
<body>
<main id="app"></main>
<script>
// ───────── 질문·원고 (여기만 고치면 됨) ─────────
// v: 같은 답으로 이어지는 다른 질문 표현 (면접관은 외운 문장 그대로 묻지 않음)
// s: [영어, 한글]. " / " = 끊어 읽는 자리(한 호흡). 한 문장은 짧게, 같은 문장틀을 여러 답에서 다시 씀.
const DAYS=['11/14 (토)','11/15 (일)','11/16 (월)','11/17 (화)'];
const Q=[
// 자기소개는 13문장이라 한 번에 외우기 길어서 앞·뒤 둘로 나눔. 모의면접에서는 합쳐서 한 번에 답함
{id:'intro',day:0,t:'자기소개 ① 앞부분',q:'Please introduce yourself.',qk:'자기소개를 해 주세요. (앞부분)',v:["Tell us about yourself.", "Could you briefly introduce yourself?", "Who are you, and what do you do?"],s:[
 ['Hello. / My name is Park Junseong.','안녕하세요. 박준성입니다.'],
 ['I work on AI policy / at Gimhae City.','김해시에서 AI 정책 일을 합니다.'],
 ['I studied economics / and urban regeneration.','경제학과 도시재생학을 공부했습니다.'],
 ['My main interest is AX.','제 주된 관심은 AX입니다.'],
 ['AX means using AI / to change old industries.','AX는 AI로 기존 산업을 바꾸는 것입니다.'],
 ['These days, / I work on a power semiconductor project / with Ulsan.','요즘은 울산과 전력반도체 사업을 추진하고 있습니다.']]},
{id:'intro2',day:0,t:'자기소개 ② 뒷부분',q:'Please introduce yourself.',qk:'자기소개를 해 주세요. (뒷부분: "울산과 전력반도체 사업" 다음부터)',v:["Tell us about yourself.", "Could you briefly introduce yourself?", "Who are you, and what do you do?"],s:[
 ['Power semiconductors are the key / to AI data centers / and physical AI.','전력반도체는 AI 데이터센터와 피지컬 AI의 핵심입니다.'],
 ['They also help / cars and ships.','자동차와 조선에도 도움이 됩니다.'],
 ['So I connect / universities, labs, and companies.','그래서 대학, 연구소, 기업을 연결합니다.'],
 ['Recently, / I discussed joint research / with the APEC Climate Center.','최근 APEC 기후센터와 공동연구를 논의했습니다.'],
 ['I have one big question.','저에게는 큰 질문이 하나 있습니다.'],
 ['How can new technology / make people\'s lives better?','새 기술이 어떻게 사람들의 삶을 낫게 할 수 있을까?'],
 ['That is why / I want to study at KAIST.','그래서 KAIST에서 공부하고 싶습니다.'],
 ['Thank you.','감사합니다.']]},
{id:'why',day:0,t:'지원 동기',q:'Why did you apply to the Graduate School of Future Strategy?',qk:'왜 미래전략대학원에 지원했습니까?',v:["Why KAIST?", "Why did you choose this program?", "What brought you to this school?"],s:[
 ['I learned one thing / from my work.','일하면서 한 가지를 배웠습니다.'],
 ['Technology, industry, and cities / are all connected.','기술, 산업, 도시는 모두 연결되어 있습니다.'],
 ['Climate is connected too.','기후도 연결되어 있습니다.'],
 ['But policies are divided.','하지만 정책은 나뉘어 있습니다.'],
 ['So I want to study them together.','그래서 이것들을 함께 공부하고 싶습니다.'],
 ['This school is the best place / for that.','이 대학원이 그러기에 가장 좋은 곳입니다.']]},
{id:'master',day:0,t:'박사인데 왜 석사?',q:'You already have a PhD. Why do you want another master\'s degree?',qk:'이미 박사학위가 있는데 왜 석사과정에 지원했습니까?',v:["You have a doctoral degree. Why a master's program?", "Why do you need this degree?", "Isn't a PhD enough?"],s:[
 ['That is a fair question.','당연한 질문입니다.'],
 ['My PhD was about / cities and the economy.','제 박사 연구는 도시와 경제에 관한 것이었습니다.'],
 ['But now / I work on AI and new industries.','하지만 지금은 AI와 신산업 일을 합니다.'],
 ['I need new tools / for this new work.','이 새로운 일에는 새로운 도구가 필요합니다.'],
 ['I am not here / for a degree.','학위 때문에 온 것이 아닙니다.'],
 ['I am here / to learn a new way of thinking.','새로운 사고방식을 배우러 왔습니다.']]},
{id:'survive',day:0,only:1,t:'생존 표현',q:'Useful phrases',qk:'못 알아들었거나 막혔을 때',s:[
 ['Sorry, / could you say that again?','죄송합니다, 다시 말씀해 주시겠어요?'],
 ['Could you speak / a little slowly, please?','조금 천천히 말씀해 주시겠어요?'],
 ['Let me think / for a moment.','잠시 생각해 보겠습니다.'],
 ['Do you mean / my research plan?','제 연구계획을 말씀하시는 건가요?'],
 ['That is a good question.','좋은 질문입니다.'],
 ['I am not sure, / but I will try.','확실하지 않지만 답해 보겠습니다.'],
 ['Sorry. / Let me say that again.','죄송합니다. 다시 말하겠습니다.'],
 ['I don\'t know much about that, / but I want to learn.','그건 잘 모르지만 배우고 싶습니다.'],
 ['Thank you / for your time.','시간 내 주셔서 감사합니다.']]},
{id:'research',day:1,t:'박사 연구',q:'Please tell us about your previous research.',qk:'이전 연구를 소개해 주세요.',v:["What was your PhD research about?", "Tell us about your doctoral thesis.", "What did you study before?"],s:[
 ['I studied suicide risk / in local areas.','지역별 자살 위험을 연구했습니다.'],
 ['I focused on / economic factors.','경제적 요인에 집중했습니다.'],
 ['I found one thing.','한 가지를 발견했습니다.'],
 ['In the same city, / the risk is very different / from area to area.','같은 도시 안에서도 지역마다 위험이 크게 다릅니다.'],
 ['So the problem is / not just personal.','그래서 이 문제는 개인만의 문제가 아닙니다.'],
 ['It comes from / the local economy.','지역 경제에서 비롯됩니다.'],
 ['I proposed a policy / to the National Assembly Research Service.','국회입법조사처에 정책을 제안했습니다.']]},
{id:'study',day:1,t:'학업 계획',q:'What do you want to study at KAIST?',qk:'KAIST에서 무엇을 공부하고 싶습니까?',v:["What is your research plan?", "What topic are you interested in?", "What will you research here?"],s:[
 ['I have one research question.','연구 질문이 하나 있습니다.'],
 ['How does new technology / change old factory cities?','새 기술은 오래된 공업도시를 어떻게 바꾸는가?'],
 ['My first case is / AI data centers.','첫 번째 사례는 AI 데이터센터입니다.'],
 ['They need / a lot of power and water.','전력과 물을 아주 많이 씁니다.'],
 ['But most site studies / miss climate risk.','하지만 대부분의 입지 연구는 기후 위험을 빠뜨립니다.'],
 ['I want to add / heat, drought, and wildfire risk.','폭염, 가뭄, 산불 위험을 더하고 싶습니다.'],
 ['My target is / the southeast region of Korea.','대상은 동남권입니다.'],
 ['I want to find / the best future strategy.','가장 좋은 미래전략을 찾고 싶습니다.']]},
{id:'dc',day:1,t:'데이터센터·기후 연구',q:'Tell us more about your data center research.',qk:'데이터센터 연구를 더 설명해 주세요.',v:["Why are you interested in AI data centers?", "What is the problem with AI data centers?", "Who will you work with on this research?"],s:[
 ['Big AI data centers / are coming to Korean regions.','대형 AI 데이터센터가 지역으로 오고 있습니다.'],
 ['For example, / Ulsan, Gangwon, and Jeolla.','예를 들어 울산, 강원, 전라도입니다.'],
 ['They bring / jobs and taxes.','일자리와 세수를 가져옵니다.'],
 ['But they use / a lot of power and water.','하지만 전력과 물을 많이 씁니다.'],
 ['They can raise / heat and drought risk.','폭염과 가뭄 위험을 키울 수 있습니다.'],
 ['Recently, / I discussed joint research / with the APEC Climate Center.','최근 APEC 기후센터와 공동연구를 논의했습니다.'],
 ['We want to add climate risk / to site analysis.','입지 분석에 기후 위험을 더하려 합니다.'],
 ['I am not against data centers.','데이터센터에 반대하는 것은 아닙니다.'],
 ['But local people / should share the benefits.','다만 지역 주민도 편익을 나눠야 합니다.']]},
{id:'after',day:1,t:'졸업 후 계획',q:'What is your plan after graduation?',qk:'졸업 후 계획은 무엇입니까?',v:["What will you do after you graduate?", "What are your future plans?", "What is your long-term goal?"],s:[
 ['I will keep working / for my region.','계속 지역을 위해 일하겠습니다.'],
 ['I will use my research / in real policy.','연구를 실제 정책에 쓰겠습니다.'],
 ['Many regions / just accept the future.','많은 지역이 미래를 그냥 받아들입니다.'],
 ['I want to change that.','저는 그것을 바꾸고 싶습니다.'],
 ['I want to help my region / choose its own future.','지역이 스스로 미래를 선택하도록 돕고 싶습니다.']]},
{id:'achieve',day:1,t:'업무 성과',q:'What is your biggest achievement at work?',qk:'직장에서 가장 큰 성과는 무엇입니까?',v:["What are you most proud of in your career?", "Tell us about your work experience.", "What have you done at your job?"],s:[
 ['My best work is / the Gimhae AI Innovation Platform.','가장 큰 성과는 김해 AI 혁신 플랫폼입니다.'],
 ['First, / I started an AI study group / at work.','먼저 직장에서 AI 연구모임을 시작했습니다.'],
 ['Then / we made an AI team.','그다음 AI 팀을 만들었습니다.'],
 ['We built the platform / by ourselves.','플랫폼을 우리 손으로 만들었습니다.'],
 ['No outside company. / No extra budget.','외부 용역도, 추가 예산도 없었습니다.'],
 ['We won a minister\'s award / for it.','이 일로 장관상을 받았습니다.']]},
{id:'closing',day:1,t:'마지막 한마디',q:'Do you have any last words?',qk:'마지막으로 하고 싶은 말이 있습니까?',v:["Is there anything you want to add?", "Any final comments?", "Anything else you would like to say?"],s:[
 ['Thank you / for this chance.','이런 기회를 주셔서 감사합니다.'],
 ['I learned a lot / in the field.','현장에서 많이 배웠습니다.'],
 ['Now / I want to study more deeply.','이제 더 깊이 공부하고 싶습니다.'],
 ['I will bring it back / to my region.','배운 것을 지역으로 가져가겠습니다.'],
 ['Thank you / for listening.','들어 주셔서 감사합니다.']]},
{id:'ax',day:2,t:'AX란?',q:'What is AX? Can you explain it simply?',qk:'AX가 무엇인지 쉽게 설명해 주세요.',v:["What does AX mean?", "You mentioned AX. What is it?", "How is AI changing industry?"],s:[
 ['AX means / AI transformation.','AX는 AI 전환을 뜻합니다.'],
 ['It means using AI / to change how we work.','AI로 일하는 방식을 바꾸는 것입니다.'],
 ['It is not just / buying software.','단순히 소프트웨어를 사는 것이 아닙니다.'],
 ['It changes / products, jobs, and factories.','제품과 일자리, 공장을 바꿉니다.'],
 ['It also changes the city.','도시도 바꿉니다.'],
 ['So AX is a question / for the whole region.','그래서 AX는 지역 전체의 문제입니다.']]},
{id:'power',day:2,t:'전력반도체',q:'Why are power semiconductors important?',qk:'전력반도체는 왜 중요합니까?',v:["What are power semiconductors?", "Why do you care about power semiconductors?", "Tell us about your power semiconductor project."],s:[
 ['Power semiconductors / control electricity.','전력반도체는 전기를 제어합니다.'],
 ['AI needs / a lot of electricity.','AI는 전기를 많이 씁니다.'],
 ['So AI data centers need / better power chips.','그래서 AI 데이터센터에는 더 좋은 전력 칩이 필요합니다.'],
 ['Better chips waste less power.','더 좋은 칩은 전력 낭비를 줄입니다.'],
 ['Electric cars, ships, and robots / need them too.','전기차, 선박, 로봇에도 필요합니다.'],
 ['My region is strong / in cars and ships.','우리 지역은 자동차와 조선이 강합니다.'],
 ['So this is a big chance / for us.','그래서 우리에게 큰 기회입니다.'],
 ['I am connecting three universities / for this.','이를 위해 세 대학을 연결하고 있습니다.']]},
{id:'leader',day:2,t:'리더십 사례',q:'Tell us about a time you showed leadership.',qk:'리더십을 발휘한 사례를 말해 주세요.',v:["Describe your leadership experience.", "Have you ever led a project?", "Tell us about a difficult project."],s:[
 ['I started / the AI WAVE Committee.','AI WAVE 위원회를 출범시켰습니다.'],
 ['City hall cannot do AX alone.','시청 혼자서는 AX를 할 수 없습니다.'],
 ['So I visited / universities and companies.','그래서 대학과 기업을 찾아갔습니다.'],
 ['At first, / it was hard.','처음에는 힘들었습니다.'],
 ['Everyone wanted / different things.','모두 원하는 것이 달랐습니다.'],
 ['So I looked for / small common points.','그래서 작은 공통점을 찾았습니다.'],
 ['Step by step, / we built trust.','한 걸음씩 신뢰를 쌓았습니다.'],
 ['I learned / that trust comes first.','신뢰가 먼저라는 것을 배웠습니다.']]},
{id:'balance',day:2,t:'일과 학업 병행',q:'You have a full-time job. How will you manage work and study?',qk:'일과 학업을 어떻게 병행하겠습니까?',v:["How will you study while working?", "Do you have enough time for this program?", "Can you handle both your job and school?"],s:[
 ['It will be hard, / but I am ready.','힘들겠지만 준비되어 있습니다.'],
 ['My work and my study / are connected.','제 일과 공부는 연결되어 있습니다.'],
 ['I can use what I learn / at work.','배운 것을 업무에 쓸 수 있습니다.'],
 ['My work problems / become my research questions.','업무의 문제가 연구 질문이 됩니다.'],
 ['I will use / evenings and weekends.','저녁과 주말을 쓰겠습니다.'],
 ['I can do both.','둘 다 해낼 수 있습니다.']]},
{id:'strength',day:2,t:'강점과 약점',q:'What are your strengths and weaknesses?',qk:'강점과 약점은 무엇입니까?',v:["What is your greatest strength?", "What is your weak point?", "How would you describe yourself?"],s:[
 ['My strength is / connecting people.','제 강점은 사람을 연결하는 것입니다.'],

// ───────── 상태 ─────────
const $=s=>document.querySelector(s),app=$('#app');
const S=JSON.parse(localStorage.kaistInterview2||'{}');
const save=()=>localStorage.kaistInterview2=JSON.stringify(S);
const lv=q=>S[q.id]||0;                 // 0~3. 0=처음, 3=완전히 외움
const bump=(q,d)=>{S[q.id]=Math.min(3,Math.max(0,lv(q)+d));S[q.id+'_t']=Date.now();save()};
// 간격 복습(Cepeda 외 2006): 통과할수록 다음 복습까지 간격을 늘림 — 20분 → 2시간 → 다음 날 (면접까지 남은 날에 맞춤)
const due=q=>lv(q)?(S[q.id+'_t']||0)+[0,12e5,72e5,576e5][lv(q)]:0;
const rate=()=>+S._rate||0.75;
const pad=()=>+S._pad||2.2; // 말할 시간 배수. 다 말했으면 화면을 탭해 넘기면 되므로 넉넉하게
const clean=en=>en.replace(/ \/ /g,' ');
const words=t=>t.split(/\s+/).length;
const hint=t=>t.split(' ').map(w=>w[0]+w.slice(1).replace(/[A-Za-z]/g,'·')).join(' '); // 첫 글자만 남김
const today=Math.min(3,Math.max(0,Math.floor((Date.now()-new Date('2026-11-14T00:00:00+09:00'))/864e5)));

// ───────── 읽어주기 ─────────
let sayId=0,wd,lt,tm,wl,mr,chunks,stream;
function say(text,onend,vary){ // vary: 목소리·속도를 무작위로 (실전은 늘 다른 사람이 물음)
  speechSynthesis.cancel();clearTimeout(wd);const id=++sayId;
  const fin=()=>{if(id!==sayId)return;sayId++;clearTimeout(wd);onend&&onend()};
  const vs=speechSynthesis.getVoices().filter(v=>v.lang.replace('_','-').startsWith('en'));
  const us=vs.filter(v=>/en.US/.test(v.lang)),voice=vary&&vs.length?vs[Math.floor(Math.random()*vs.length)]:us.find(v=>/Google|Natural|Samantha|Aria|Jenny/.test(v.name))||us[0]||vs[0];
  const u=new SpeechSynthesisUtterance(text);u.lang='en-US';if(voice)u.voice=voice;u.rate=rate()*(vary?.9+Math.random()*.3:1);u.onend=u.onerror=fin;
  speechSynthesis.speak(u);
  wd=setTimeout(fin,(words(text)*700+4000)/rate()); // 일부 휴대폰은 끝났다는 신호를 안 줌 → 시간으로 넘김
}
speechSynthesis.getVoices();
const later=(f,ms)=>{clearTimeout(lt);lt=setTimeout(f,ms)};
// ───────── 말 끝 감지: 소리 크기만 봄. 음성은 기기 밖으로 나가지 않음 ─────────
// ponytail: 아이폰은 마이크가 켜져 있는 동안 읽어 주는 소리가 작아질 수 있음. 심하면 단계마다 마이크를 껐다 켜기
let AC,vad=null,vadErr='',heard=null,lr;
const vadOn=()=>S._vad!==false;
function micOn(){if(!vadOn()||vad||!navigator.mediaDevices)return;
  AC=AC||new AudioContext();AC.resume(); // 버튼을 누른 순간에 만들어야 아이폰에서 동작
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(st=>{
    if(!P)return st.getTracks().forEach(t=>t.stop());
    const an=AC.createAnalyser();an.fftSize=1024;AC.createMediaStreamSource(st).connect(an);vad={st,an,buf:new Float32Array(1024)};vadErr=''
  }).catch(e=>vadErr=micErr(e))}
function micOff(){vad&&vad.st.getTracks().forEach(t=>t.stop());vad=null}
// 주변 소음(floor)은 조용할 땐 바로 내려가고 시끄러우면 천천히 올라감 → 바로 말을 시작해도 목소리를 소음으로 착각하지 않음
// 소음의 3배 넘는 소리가 0.3초 넘게 난 뒤 1.2초 조용하면 "다 말함"
function vadTick(st,v,now){st.floor=v<st.floor?v:st.floor*.998+v*.002;
  if(v>Math.max(.015,st.floor*3)){st.spoke=st.spoke||now;st.quiet=now}
  return st.spoke&&st.quiet-st.spoke>300&&now-st.quiet>1200?1:0}
function hear(go){if(!vad)return;const st={floor:.01,spoke:0,quiet:0};
  const f=()=>{vad.an.getFloatTimeDomainData(vad.buf);let s=0;for(const x of vad.buf)s+=x*x;const v=Math.sqrt(s/vad.buf.length),b=$('#lv');
    b&&(b.style.width=Math.min(100,v*400)+'%');if(vadTick(st,v,Date.now()))return go();if(st.spoke)heard=true;lr=requestAnimationFrame(f)};f()}
let ptok=0;
function halt(){ptok++;const sg=$('#stage');sg&&(sg.onclick=null);cancelAnimationFrame(lr);clearTimeout(lt);clearTimeout(wd);clearInterval(tm);sayId++;speechSynthesis.cancel();if(mr&&mr.state!=='inactive'){mr.onstop=null;mr.stop()}stream&&stream.getTracks().forEach(t=>t.stop())}
const micErr=e=>({NotAllowedError:'브라우저가 마이크를 막았습니다. 주소창 왼쪽 자물쇠 → 마이크 → 허용',NotFoundError:'마이크를 찾지 못했습니다',NotReadableError:'다른 프로그램(줌·팀즈 등)이 마이크를 쓰고 있습니다'}[e.name]||e.name+': '+e.message);
// 마이크 확인: 10초 동안 소리 크기 막대와 쓰는 마이크 이름을 보여 줌
function micTest(out){
  navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{
    const ac=new AudioContext(),an=ac.createAnalyser(),buf=new Uint8Array(an.fftSize),t0=Date.now();ac.createMediaStreamSource(st).connect(an);
    out.innerHTML=`🎙 ${st.getAudioTracks()[0].label} — 말해 보세요<div class="gbar"><i id="lvl" style="animation:none;width:0"></i></div>`;
    let peak=0;const tick=()=>{an.getByteTimeDomainData(buf);const v=Math.max(...buf.map(x=>Math.abs(x-128)))/128;peak=Math.max(peak,v);
      const b=$('#lvl');if(b&&Date.now()-t0<1e4){b.style.width=Math.min(100,v*250)+'%';return requestAnimationFrame(tick)}
      st.getTracks().forEach(t=>t.stop());ac.close();
      if(out.isConnected)out.textContent=peak>.05?'✔ 마이크 정상 입력':'✖ 소리가 안 들어옵니다. Windows 소리 설정 → 입력 장치를 확인하세요'};tick()
  }).catch(e=>out.textContent='✖ '+micErr(e))}
const awake=()=>navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wl=w).catch(()=>{}); // 훈련 중 화면 꺼짐 방지
document.addEventListener('visibilitychange',()=>{if(P&&!document.hidden)awake()});

// ───────── 진행기: 단계 목록을 받아 알아서 넘김 ─────────
// 단계 = {tag, html, say?, gap?(true=읽은 시간만큼 / 숫자 ms), rest?, wait?(next)}
let P=null;
function run(steps,onDone){
  P={steps,i:0,onDone,paused:false};awake();micOn();
  app.innerHTML=`<div class="top"><button onclick="quit()">✕</button><div class="pg"><i id="pgb"></i></div></div><div id="cnt"></div>
    <div id="stage"></div><div class="ctl"><button onclick="mv(-1)">⏮</button><button id="pp" onclick="pause()">⏸</button><button onclick="mv(1)">⏭</button></div>`;
  show();
}
function show(){
  halt();P.sub=null;const s=P.steps[P.i];
  if(!s){const d=P.onDone;P=null;micOff();wl&&wl.release();return d?d():home()}
  $('#pgb').style.width=P.i/P.steps.length*100+'%';
  const stage=$('#stage'),next=()=>{P.i++;show()};
  if(P.paused)return paint(s,stage);
  s.wait?(paint(s,stage),s.wait(next,stage)):play(s,stage,next);
}
function paint(s,stage){$('#cnt').textContent=s.tag;stage.className='';stage.onclick=null;stage.innerHTML=s.html}
function play(s,stage,next){ // 한 단계: 보여 주고 → 읽어 주고 → 말할 틈을 준 뒤 next
  paint(s,stage);const t=Date.now(),k=++ptok; // k: 이 단계의 번호. 화면 탭·시간 끝·말 끝이 겹쳐도, 일시정지 뒤에도 옛 단계는 다음으로 못 넘김
  const gap=()=>{if(k!==ptok)return;
    const ms=(s.gap===true?(Date.now()-t)*1.5+1000:s.gap)*pad();
    if(!ms)return later(next,s.rest||350);
    const go=()=>{if(k!==ptok)return;ptok++;cancelAnimationFrame(lr);clearTimeout(lt);stage.onclick=null;next()};
    stage.className='me';stage.onclick=go;heard=vad?false:null;
    stage.insertAdjacentHTML('beforeend',`<div class="you">🗣 지금 말하세요<small>${vad?'말이 끝나면 자동으로 넘어감':vadOn()&&vadErr?'🎙 '+vadErr:'다 말했으면 화면 탭'}</small></div>${vad?'<div class="mic"><i id="lv"></i></div>':''}<div class="gbar"><i style="animation-duration:${ms}ms"></i></div>`);
    later(go,ms);hear(go)};
  if(s.say){stage.insertAdjacentHTML('afterbegin','<div class="who">👂 듣기</div>');say(s.say,()=>{const w=stage.querySelector('.who');w&&w.remove();gap()},s.vary)}else gap();
}
function mv(d){P.paused=false;$('#pp').textContent='⏸';if(P.sub)return P.sub(d);P.i=Math.min(P.steps.length-1,Math.max(0,P.i+d));show()}
function pause(){P.paused=!P.paused;$('#pp').textContent=P.paused?'▶':'⏸';P.paused?halt():show()}
function quit(){halt();P=null;micOff();wl&&wl.release();home()}

// ───────── 단계 만들기 ─────────
const H=(en,ko)=>`<div class="ko">${ko}</div><div class="en">${en}</div>`;
// 듣고 따라 하기 (한 문장): 끊어서 한 덩이씩 → 문장 통째로
function echo1(q,k,tag){const[en,ko]=q.s[k],cs=en.split(' / '),full=cs.join(' '),out=[];
  if(cs.length>1)cs.forEach((c,j)=>out.push({tag,say:c,gap:true,html:H(cs.map((x,m)=>m===j?`<b>${x}</b>`:`<span class="dim">${x}</span>`).join(' '),ko)}));
  out.push({tag,say:full,gap:true,html:H(`<b>${full}</b>`,ko)});return out}
// 사라지는 단서(Glisky·Schacter·Tulving 1986): 맞힐수록 힌트가 줄어듦. 0=모든 단어 첫 글자, 1=덩이 첫 단어만, 2=한글만
const cue=(en,n)=>`<span class="hint">${n>=2?'(힌트 없음)':n?en.split(' / ').map(c=>c.split(' ').map((w,i)=>i?w.replace(/[A-Za-z]/g,'·'):w).join(' ')).join(' '):hint(clean(en))}</span>`;
// 1) 문장 암기. 세 연구를 합친 일정:
//  - 간격을 늘려 가며 다시 꺼내기(Pimsleur 1967): 본 뒤 5초 → 25초 → 2분
//  - 기준까지 반복(Rawson & Dunlosky 2011): 한 문장을 NEED번 맞혀야 끝. 틀리면 한 칸 뒤로
//    논문 권장은 3번이지만 면접까지 시간이 없어 2번으로 줄이고, 나머지는 ②·③과 다음 날 복습이 메움
//  - 다시 읽지 않고 꺼내기(Roediger & Karpicke 2006): 정답은 말해 본 뒤에만 보여 줌
// ponytail: 남은 문장이 적으면 간격을 못 채우고 바로 다시 나옴. 다른 답의 문장을 사이에 끼우면 해결되지만 흐름이 복잡해짐
const GAPS=[5e3,25e3,12e4],NEED=2;
function drill(q){
  const c=q.s.map(([en,ko],k)=>({en,ko,k,n:0,due:0,seen:false})); // 일시정지 후에도 이어지도록 바깥에 둠
  return[{tag:q.t+' · ① 문장 암기',html:'',wait:(done,stage)=>{
    let cur;const i0=P.i;
    const tag=()=>`${q.t} · ① 문장 암기 — 완료 ${c.filter(x=>x.n>=NEED).length}/${c.length}`;
    const seq=(steps,then)=>{let i=0;const go=()=>i<steps.length?play(steps[i++],stage,go):then();go()};
    const intro=x=>seq(echo1(q,x.k,tag()),()=>{x.seen=true;x.due=Date.now()+GAPS[0];loop()});
    const pass=x=>{x.n++;x.due=Date.now()+(GAPS[x.n]||0)};
    const test=x=>{const full=clean(x.en);
      play({tag:tag(),gap:(words(full)*550+1800)/rate(),html:'<div class="who">🔁 앞에서 배운 문장 — 안 보고 말하기</div>'+H(cue(x.en,x.n),x.ko)},stage,()=>{
        let bad=heard===false; // 마이크가 켜져 있는데 아무 말도 안 했으면 못 꺼낸 것으로 침
        play({tag:tag(),say:full,rest:1500,html:H(`<b>${full}</b>`,x.ko)+(bad?'<button id="bad" disabled>🔇 말소리를 못 들음 — 곧 다시 나옵니다</button>':'<button id="bad">😵 틀렸음</button>')},stage,()=>{
          if(bad){x.n=Math.max(0,x.n-1);x.due=Date.now()+GAPS[0]}else pass(x);loop()});
        $('#bad').onclick=e=>{bad=true;e.target.textContent='곧 다시 나옵니다';e.target.disabled=true}})};
    function loop(){
      const left=c.filter(x=>x.n<NEED);if(!left.length){P.sub=null;return done()}
      $('#pgb').style.width=(i0+c.reduce((a,x)=>a+x.n,0)/(NEED*c.length))/P.steps.length*100+'%';
      const old=left.filter(x=>x.seen).sort((a,b)=>a.due-b.due),fresh=left.find(x=>!x.seen);
      cur=old[0]&&old[0].due<=Date.now()?old[0]:fresh||old[0]; // 때가 된 문장 먼저, 없으면 새 문장
      cur.seen?test(cur):intro(cur)}
    P.sub=d=>{halt();if(!cur)return loop();if(d<0)return cur.seen?test(cur):intro(cur); // ⏮ 지금 문장 다시, ⏭ 넘김
      if(cur.seen)pass(cur);else{cur.seen=true;cur.due=Date.now()+GAPS[0]}loop()};
    loop()}}]}
// 2) 빠른 복습: 덩이 첫 단어만 보고 한 번씩
function trans(q){return q.s.flatMap(([en,ko],k)=>{const full=clean(en),tag=`${q.t} · ② 빠른 복습 ${k+1}/${q.s.length}`;
  return[{tag,gap:(words(full)*550+1800)/rate(),html:H(cue(en,1),ko)},{tag,say:full,rest:700,html:H(`<b>${full}</b>`,ko)}]})}
// 3) 질문 듣고 통째로: 문장 첫머리만 보고 답변 전체 → 모범답안과 비교, 스스로 판정
const PACE=[90,100,110,120]; // 수준별 목표 속도(분당 단어). 😀 누를수록 목표 시간이 줄어듦
function whole(q,vary){const tag=`${q.t} · ③ 질문 듣고 통째로`,ask=vary&&q.v?q.v[Math.floor(Math.random()*q.v.length)]:q.q;return[
  {tag,say:ask,vary,rest:200,html:`<div class="big">🔊</div><div class="ko" style="text-align:center">질문을 들으세요</div>`},
  {tag,html:'',wait:(next,stage)=>{
    const goal=Math.round(words(clean(q.s.map(x=>x[0]).join(' ')))/PACE[lv(q)]*60),t0=Date.now();
    stage.className='me';
    stage.innerHTML=`<div class="ko">Q. ${ask===q.q?q.qk:ask}</div><div class="cue">${q.s.map(x=>clean(x[0]).split(' ').slice(0,2).join(' ')+' …').join('<br>')}</div>
      <div class="you">🗣 답변하세요 <span class="timer" id="tm">0</span>초 <small>목표 ${goal}초</small></div><div class="gbar"><i style="animation-duration:${goal}s"></i></div>
      <div class="two"><button id="again">🔊 질문 다시</button><button class="ok" id="fin">다 말했다</button></div>`;
    $('#again').onclick=()=>say(ask,null,vary);
    tm=setInterval(()=>{const e=$('#tm');e&&(e.textContent=Math.floor((Date.now()-t0)/1000))},250);
    if(S._rec)navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{stream=st;chunks=[];mr=new MediaRecorder(st);mr.ondataavailable=e=>chunks.push(e.data);mr.start()}).catch(e=>{const y=stage.querySelector('.you');y&&y.insertAdjacentHTML('afterend',`<div class="ko">🎙 녹음 안 됨 — ${micErr(e)}</div>`)});
    $('#fin').onclick=()=>{
      const sec=Math.round((Date.now()-t0)/1000);clearInterval(tm);stage.className='';
      stage.innerHTML=`<div class="ko">Q. ${ask}</div><div class="${sec<=goal?'you':'ko'}">${sec<=goal?'✔':'⏱'} 내 답변 ${sec}초 · 목표 ${goal}초${sec<=goal?'':' (넘김)'}</div><div id="au"></div><div class="ans">${q.s.map(x=>`<p>${clean(x[0])}<small>${x[1]}</small></p>`).join('')}</div>
        <button id="mdl">▶ 모범답안 듣기</button><div class="two"><button id="no">😵 아직</button><button class="ok" id="yes">😀 됐다</button></div>`;
      if(mr&&mr.state!=='inactive'){mr.onstop=()=>{const a=$('#au');a&&(a.innerHTML=`<audio controls src="${URL.createObjectURL(new Blob(chunks,{type:mr.mimeType}))}"></audio>`);stream.getTracks().forEach(t=>t.stop())};mr.stop()}
      $('#mdl').onclick=()=>say(clean(q.s.map(x=>x[0]).join(' ')));
      $('#no').onclick=()=>{bump(q,-1);next()};$('#yes').onclick=()=>{bump(q,1);next()};
    }}}]}
// 수준에 맞춰 단계를 줄임: 처음엔 ①문장 암기+③, 한 번 통과하면 ②빠른 복습+③, 그다음은 ③만
const ladder=(q,all)=>q.only
  ?[...(all||lv(q)<2?drill(q):trans(q)),{tag:q.t,html:'',wait:n=>{bump(q,1);n()}}]
  :[...(all||lv(q)<1?drill(q):lv(q)<2?trans(q):[]),...whole(q,lv(q)>=1)]; // 처음엔 기본 질문, 한 번 통과하면 변형 질문
// 예상 소요 시간(분). 실제 TTS는 분당 약 150단어 × 읽는 속도로 잡음. 화면을 탭해 일찍 넘기면 더 짧아짐
const tts=t=>words(t)*.3/rate()+.5,stepT=t=>{const d=tts(t);return d+(d*1.5+1)*pad()+.35};
const recallT=f=>(words(f)*.55+1.8)/rate()*pad()+tts(f)+1.5;
const est=q=>((lv(q)<1||q.only&&lv(q)<2
  ?q.s.reduce((a,[en])=>{const cs=en.split(' / '),f=clean(en);return a+(cs.length>1?cs.reduce((b,c)=>b+stepT(c),0):0)+stepT(f)+NEED*recallT(f)},0)
  :lv(q)<2||q.only?q.s.reduce((a,[en])=>a+recallT(clean(en)),0):0)
  +(q.only?0:(w=>w/PACE[lv(q)]*60+tts(q.q)+25)(words(clean(q.s.map(x=>x[0]).join(' '))))))/60;
const listenAll=()=>Q.flatMap(q=>[{tag:q.t+' · 듣기만',say:q.q,rest:500,html:H(`<b>${q.q}</b>`,q.qk)},...q.s.map(([en,ko])=>({tag:q.t+' · 듣기만',say:clean(en),rest:400,html:H(clean(en),ko)}))]);

console.assert(Q.every(q=>q.only||q.v.length>=3),'질문 변형 3개씩');
console.assert(hint('I am.')==='I a·.','hint');
console.assert(echo1({s:[['a / b','x']]},0).length===3,'echo1: 덩이 2 + 문장 1');
console.assert(cue('I work / at home.',1).includes('I ···· at ····.')&&cue('a',2).includes('힌트 없음'),'cue: 단서 소거');
console.assert(drill(Q[1]).length===1&&ladder(Q[1]).length===3,'ladder: 문장 암기 1 + 통째로 2');
for(const s0 of[300,0]){const st={floor:.01,spoke:0,quiet:0},v=t=>t>=s0&&t<s0+700?.1:.005;let end=0; // (소음 →) 0.7초 말함 → 조용
 for(let t=0;t<4000&&!end;t+=16)end=vadTick(st,v(t),t)&&t;console.assert(end>s0+1900&&end<s0+2000,'vadTick: 말 끝나고 1.2초 뒤 넘김',s0,end)}
console.assert(Q[0].s.length+Q[1].s.length===14&&Q[1].id==='intro2','자기소개 6+7로 나눔');
console.assert(est(Q[1])>5&&est(Q[1])<20,'est: 자기소개 뒷부분 5~20분');
console.assert(Q.every(q=>q.s.every(x=>x[0].split(' / ').every(c=>words(c)<=8))),'한 덩이 8단어 이하');

// ───────── 첫 화면 ─────────
function home(){
  halt();
  const pool=Q.filter(q=>q.day<=today),sess=[...pool].sort((a,b)=>due(a)-due(b)).slice(0,2); // 새 질문 먼저, 그다음 복습할 때가 된 순. 한 번에 2개만
  const d=Math.ceil((new Date('2026-11-18T00:00:00+09:00')-Date.now())/864e5);
  const done=Q.filter(q=>lv(q)>=3).length;
  app.innerHTML=`<h1>KAIST 영어 면접 <span class="chip">${d>0?'D-'+d:d===0?'당일':'종료'}</span><span class="chip">완성 ${done}/${Q.length}</span></h1>
    <button class="go p" id="b1"><b>▶ 오늘 훈련 시작</b><small>누르면 끝까지 알아서 진행 · 약 ${Math.round(sess.reduce((a,q)=>a+est(q),0))}분 · ${sess.map(q=>q.t).join(', ')}</small></button>
    <button class="go" id="b2"><b>🎤 실전 모의면접</b><small>질문 5개를 소리로만 듣고 답하기</small></button>
    <button class="go" id="b3"><b>🎧 듣기만</b><small>전체 질문과 답을 차례로 들려줌 (이동 중에)</small></button>
    <button class="go" id="b4"><b>📄 전체 원고 보기</b><small>모든 질문과 답을 한 화면에 · 문장을 누르면 읽어 줌</small></button>
    ${DAYS.map((dn,i)=>{const qs=Q.filter(q=>q.day===i);return qs.length?`<h3>${i+1}일차 · ${dn}</h3>`+qs.map(q=>
      `<button class="item" data-id="${q.id}"><span class="t">${q.t}<small>${q.q}</small></span><span class="dots">${lv(q)&&lv(q)<3&&due(q)<=Date.now()?'⏰ ':''}${'●'.repeat(lv(q))}${'○'.repeat(3-lv(q))}</span></button>`).join(''):`<h3>4일차 · ${dn} — 새 질문 없음. 모의면접 반복</h3>`}).join('')}
    <div class="set"><label>읽는 속도 <input id="rate" type="range" min="0.6" max="1.1" step="0.05" value="${rate()}"><span id="rv">${rate()}배</span></label>
    <label>말할 시간 <input id="pad" type="range" min="1" max="3" step="0.2" value="${pad()}"><span id="pv">${pad()}배</span></label>
    <label><input id="rec" type="checkbox" ${S._rec?'checked':''}> 통째로 말할 때 내 목소리 녹음해서 들려주기 (마이크 허용 필요)</label>
    <label><input id="vad" type="checkbox" ${vadOn()?'checked':''}> 🎙 말이 끝나면 자동으로 넘김 (소리 크기만 봄 · 음성은 기기 밖으로 안 나감)</label>
    <button id="mic">🎙 마이크 확인</button><span id="micout"></span>
    <span>● 세 개가 차면 완성. ⏰ = 복습할 때가 됨. 질문을 누르면 그 질문만 처음부터 연습.</span>
    <details><summary>이 훈련법의 근거 (연구 논문)</summary><ul style="padding-left:18px;margin:6px 0">
    <li><b>본 뒤 5초·25초·2분 간격으로 다시 꺼내기</b> — Pimsleur (1967). A memory schedule. <i>The Modern Language Journal, 51</i>(2), 73–75.</li>
    <li><b>한 문장을 정해진 횟수만큼 맞힐 때까지, 다음 훈련에서 다시</b> (논문 권장은 3번, 시간 때문에 2번으로 줄임) — Rawson &amp; Dunlosky (2011). Optimizing schedules of retrieval practice for durable and efficient learning: How much is enough? <i>Journal of Experimental Psychology: General, 140</i>(3), 283–302.</li>
    <li><b>맞힐수록 힌트가 사라짐</b> — Glisky, Schacter &amp; Tulving (1986). Learning and retention of computer-related vocabulary in memory-impaired patients: Method of vanishing cues. <i>Journal of Clinical and Experimental Neuropsychology, 8</i>(3), 292–312.</li>
    <li><b>다시 읽지 않고 안 보고 말하기</b> — Roediger &amp; Karpicke (2006). Test-enhanced learning. <i>Psychological Science, 17</i>(3), 249–255.</li>
    <li><b>시간 간격을 늘려 복습 (20분 → 2시간 → 다음 날)</b> — Cepeda, Pashler, Vul, Wixted &amp; Rohrer (2006). Distributed practice in verbal recall tasks. <i>Psychological Bulletin, 132</i>(3), 354–380.</li>
    <li><b>소리 내어 말하기</b> — MacLeod, Gopie, Hourihan, Neary &amp; Ozubko (2010). The production effect. <i>Journal of Experimental Psychology: Learning, Memory, and Cognition, 36</i>(3), 671–685.</li>
    <li><b>같은 답을 점점 짧은 시간에</b> — Nation (1989). Improving speaking fluency. <i>System, 17</i>(3), 377–384.</li>
    <li><b>질문을 실전처럼 바꿔 듣기</b> — Morris, Bransford &amp; Franks (1977). Levels of processing versus transfer appropriate processing. <i>Journal of Verbal Learning and Verbal Behavior, 16</i>(5), 519–533.</li>
    </ul></details></div>`;
  $('#b1').onclick=()=>run(sess.flatMap(q=>ladder(q)));
  $('#b2').onclick=()=>{const[a,b]=Q,intro={...a,t:'자기소개',qk:'자기소개를 해 주세요.',s:[...a.s,...b.s]}; // 실전에선 자기소개를 한 번에
    const rest=Q.filter(q=>!q.only&&q!==a&&q!==b).map(q=>[lv(q)+Math.random()*1.5,q]).sort((a,b)=>a[0]-b[0]).slice(0,4).map(x=>x[1]);run([intro,...rest].flatMap(q=>whole(q,true)))};
  $('#b3').onclick=()=>run(listenAll());
  $('#b4').onclick=script;
  app.querySelectorAll('.item').forEach(b=>b.onclick=()=>run(ladder(Q.find(q=>q.id===b.dataset.id),true)));
  $('#rate').oninput=e=>{S._rate=e.target.value;save();$('#rv').textContent=e.target.value+'배'};
  $('#pad').oninput=e=>{S._pad=e.target.value;save();$('#pv').textContent=e.target.value+'배'};
  $('#vad').onchange=e=>{S._vad=e.target.checked;save()};
  $('#mic').onclick=()=>micTest($('#micout'));
  $('#rec').onchange=e=>{S._rec=e.target.checked;save()};
}

function script(){
  halt();scrollTo(0,0);
  app.innerHTML=`<div class="top"><button id="back">← 처음으로</button><b style="flex:1">전체 원고</b><label class="set" style="margin:0"><input id="ko" type="checkbox" checked> 한글</label></div>
    <nav class="toc">${Q.map(q=>`<a href="#s-${q.id}">${q.t}</a>`).join('')}</nav>
    ${Q.map(q=>`<section class="sc" id="s-${q.id}"><h3>${q.t}</h3><p class="qq" data-say="${q.q}">Q. ${q.q}<small>${q.qk}</small></p>
      ${q.v?`<p class="vv">비슷한 질문: ${q.v.join(' · ')}</p>`:''}
      ${q.s.map(([en,ko])=>`<p class="ss" data-say="${clean(en).replace(/"/g,'&quot;')}">${en.split(' / ').join(' <span class="sl">/</span> ')}<small>${ko}</small></p>`).join('')}</section>`).join('')}
    <button class="go" id="back2">← 처음으로</button>`;

  app.querySelectorAll('[data-say]').forEach(p=>p.onclick=()=>{app.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));p.classList.add('on');say(p.dataset.say,()=>p.classList.remove('on'))});
}
home();
