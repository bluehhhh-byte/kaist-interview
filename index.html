<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>KAIST 면접 최종 대본</title>
<style>
:root{color-scheme:dark;--bg:#12151b;--card:#1b2029;--fg:#e6e9ef;--mut:#98a2b3;--line:#2c3340;--acc:#6ea0ff;--ok:#4cc38a;--me:#12301f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 "Segoe UI","Malgun Gothic",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px;min-height:100dvh;display:flex;flex-direction:column}
button{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);cursor:pointer}
h1{font-size:19px;margin:4px 0 10px}
.tip{color:var(--mut);font-size:14px;margin:0 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}.chips button{padding:6px 12px;border-radius:99px;font-size:14px}.chips .on{background:var(--acc);border-color:var(--acc);color:#fff}
.go{display:block;width:100%;text-align:left;margin:6px 0;padding:14px}
.go b{display:block;font-size:17px}.go small{color:var(--mut)}
.go.p{background:var(--acc);border-color:var(--acc);color:#fff}.go.p small{color:#ffffffcc}
.top{display:flex;align-items:center;gap:10px}.top button{padding:6px 12px}
#tag{flex:1;font-size:13px;color:var(--mut)}
#stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:18px 14px;margin:10px 0;border-radius:18px;border:1px solid var(--line);background:var(--card);min-height:320px}
#stage.ans{background:var(--me);border-color:var(--ok)}
.qk{color:var(--acc);font-weight:600}
.ko{color:var(--mut);font-size:15px}
.en{font-size:25px;line-height:1.4}
.ls{display:grid;gap:6px;font-size:19px;line-height:1.35}.ls small{display:block;color:var(--mut);font-size:13px}
.m{color:var(--mut);letter-spacing:1px}
.big{font-size:44px;text-align:center}
.timer{font-variant-numeric:tabular-nums;color:var(--ok);font-weight:600}
.ctl{display:flex;gap:8px;padding-bottom:env(safe-area-inset-bottom)}.ctl button{flex:1;font-size:18px;padding:16px 8px}
.pri{background:var(--acc);border-color:var(--acc);color:#fff}.okb{background:var(--ok);border-color:var(--ok);color:#fff}
.sc h3{margin:18px 0 4px;color:var(--acc);font-size:16px}
.sc p{margin:0;padding:7px 6px;border-radius:8px;cursor:pointer;font-size:18px}.sc p small{display:block;color:var(--mut);font-size:13px}.sc p.on{background:var(--me)}
.set{color:var(--mut);font-size:14px;margin-top:14px;display:flex;align-items:center;gap:8px}
details{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<main id="app"></main>
<script>
// ───────── 최종 대본 (사용자 원고, 2026-11-18) ─────────
const Q=[
{t:'1. 자기소개',q:'Could you please introduce yourself?',qk:'자기소개를 해 주시겠어요?',s:[
 ['Hello, my name is Park Junseong.','안녕하세요, 박준성입니다.'],
 ['Nice to meet you.','만나서 반갑습니다.'],
 ['I work on AI policy and strategy for Gimhae City.','김해시에서 AI 정책과 전략 일을 합니다.'],
 ['I studied economics and urban regeneration.','경제학과 도시재생학을 공부했습니다.'],
 ['I\'m very interested in AX.','AX에 관심이 많습니다.'],
 ['For me, AX means using AI to improve traditional industries and cities.','제게 AX는 AI로 전통 산업과 도시를 개선하는 것입니다.'],
 ['I came here from Gimhae today, I\'m ready to learn.','오늘 김해에서 왔고, 배울 준비가 되어 있습니다.'],
 ['I still have a lot to learn, and I\'m really excited about this opportunity.','아직 배울 게 많고, 이번 기회가 정말 설렙니다.'],
 ['I hope to do some good research here at KAIST.','이곳 KAIST에서 좋은 연구를 하고 싶습니다.'],
 ['Thank you for listening.','들어 주셔서 감사합니다.']]},
{t:'2. 지원 동기',q:'Why do you want to study at KAIST Future Strategy Graduate School?',qk:'왜 KAIST 미래전략대학원에서 공부하고 싶습니까?',s:[
 ['I learned one important thing from my work.','일하면서 중요한 것 하나를 배웠습니다.'],
 ['Technology, industry, and cities are connected.','기술, 산업, 도시는 연결되어 있습니다.'],
 ['But policies are often separated.','하지만 정책은 자주 따로 갑니다.'],
 ['I want to study them together.','이것들을 함께 공부하고 싶습니다.'],
 ['KAIST is a good place for that.','KAIST가 그러기에 좋은 곳입니다.'],
 ['And I want to use what I learn for my region.','그리고 배운 것을 우리 지역을 위해 쓰고 싶습니다.']]},
{t:'3. 연구 계획',q:'What do you want to study at KAIST?',qk:'KAIST에서 무엇을 공부하고 싶습니까?',s:[
 ['I want to study AI data centers in the southeast region — Busan, Ulsan, and Gyeongnam.','동남권, 즉 부산·울산·경남의 AI 데이터센터를 연구하고 싶습니다.'],
 ['They are not just digital infrastructure.','데이터센터는 단순한 디지털 인프라가 아닙니다.'],
 ['They use lots of power, water, and land, like a new factory.','새로운 공장처럼 전력, 물, 땅을 많이 씁니다.'],
 ['So I have three questions.','그래서 세 가지 질문이 있습니다.'],
 ['Is there enough power and water?','전력과 물이 충분한가?'],
 ['Is it safe from climate risk?','기후 위험에서 안전한가?'],
 ['And do local people benefit?','그리고 지역 주민이 혜택을 받는가?'], // 원고 "do that local people" → that 빼야 문법이 맞음
 ['My goal is to make a future guide for choosing best locations.','목표는 최적의 입지를 고르는 미래 가이드를 만드는 것입니다.']]}];

// ───────── 상태·읽어주기 ─────────
const $=s=>document.querySelector(s),app=$('#app');
const S=JSON.parse(localStorage.kaistFinal||'{}'),save=()=>localStorage.kaistFinal=JSON.stringify(S);
const rate=()=>+S.rate||0.8;
const scope=()=>S.scope==null?-1:S.scope; // -1 = 세 질문 전부
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,r)=>p[0]-r[0]).map(x=>x[1]);
function say(text,onend){speechSynthesis.cancel();
  const vs=speechSynthesis.getVoices().filter(v=>/^en.US/.test(v.lang.replace('_','-')));
  const u=new SpeechSynthesisUtterance(text.replace(/—/g,','));u.lang='en-US';u.rate=rate();
  const v=vs.find(v=>/Google|Natural|Samantha|Aria|Jenny/.test(v.name))||vs[0];if(v)u.voice=v;
  u.onend=onend||null;speechSynthesis.speak(u)}
speechSynthesis.getVoices();
const all=q=>q.s.map(x=>x[0]).join(' ');

// ───────── 카드 만들기 ─────────
// 앞 n단어만 보이고 나머지는 글자 수만큼 점
const showN=(en,n)=>en.split(' ').map((w,i)=>i<n?w:`<span class="m">${w.replace(/[A-Za-z]/g,'·')}</span>`).join(' ');
const ansAll=q=>`<div class="qk">Q. ${q.q}</div><div class="ls">${q.s.map(([en,ko])=>`<div>${en}<small>${ko}</small></div>`).join('')}</div>`;
const ans1=([en,ko])=>`<div class="en">${en}</div><div class="ko">${ko}</div>`;
const M={
 listen:{t:'🎧 듣고 따라 하기',d:'한 문장씩 듣고 그대로 따라 말하기 (처음 1번)',one:1,sent:1,
   p:(q,x)=>({html:`<div class="ko">${q.t} · 듣고 따라 말하세요</div>`+ans1(x),say:x[0]})},
 half:{t:'✂️ 문장 절반 보고 말하기',d:'앞 절반만 보고 문장 전체 말하기',sent:1,
   p:(q,[en,ko])=>({html:`<div class="ko">${q.t} · ${ko}</div><div class="en">${showN(en,Math.ceil(en.split(' ').length/2))}</div>`,a:ans1([en,ko]),say2:en})},
 first:{t:'1️⃣ 첫 단어만 보고 말하기',d:'첫 단어와 한글 뜻만 보고 문장 전체 말하기',sent:1,
   p:(q,[en,ko])=>({html:`<div class="ko">${q.t} · ${ko}</div><div class="en">${showN(en,1)}</div>`,a:ans1([en,ko]),say2:en})},
 two:{t:'✌️ 앞 두 단어 → 답변 전체',d:'문장마다 앞 두 단어만 보고 답변을 처음부터 끝까지',
   p:q=>({html:`<div class="qk">Q. ${q.q}</div><div class="ls">${q.s.map(([en])=>`<div>${showN(en,2)}</div>`).join('')}</div>`,a:ansAll(q),say2:all(q)})},
 q:{t:'❓ 질문 듣고 답변 (실전)',d:'질문만 듣고 아무 힌트 없이 답변 전체',
   p:q=>({html:`<div class="big">🎤</div><div class="qk" style="text-align:center">${q.q}</div><div class="ko" style="text-align:center">${q.qk}</div><div style="text-align:center">⏱ <span class="timer" id="tm">0</span>초</div>`,say:q.q,timer:1,a:ansAll(q),say2:all(q)})}};
const qs=()=>scope()<0?Q:[Q[scope()]];
// 한 바퀴: 문장 모드는 순서대로(이어서 외우기), 답변 모드는 질문 순서를 섞음
const round=k=>M[k].sent?qs().flatMap(q=>q.s.map(x=>({k,...M[k].p(q,x)}))):shuffle(qs()).map(q=>({k,...M[k].p(q),qi:Q.indexOf(q)}));
// 섞어서 무한 반복: 어려운 쪽(답변 전체)을 더 자주
const mixOne=()=>{const k=shuffle(['half','first','two','q','q','two'])[0],q=shuffle(qs())[0];
  return M[k].sent?{k,...M[k].p(q,shuffle(q.s)[0])}:{k,...M[k].p(q),qi:Q.indexOf(q)}};

// ───────── 훈련 화면 ─────────
let P=null,tm;
function start(k){P={k,r:1,i:0,list:k==='mix'?[mixOne()]:round(k),ok:0};show()}
function show(){clearInterval(tm);
  if(P.i>=P.list.length){if(P.k==='mix')P.list.push(mixOne());else{P.r++;P.list=round(P.k);P.i=0}}
  const c=P.list[P.i],name=P.k==='mix'?'🔀 섞어서 · '+M[c.k].t:M[P.k].t;
  app.innerHTML=`<div class="top"><button onclick="home()">✕</button><span id="tag">${name} · ${P.k==='mix'?P.i+1+'장':P.r+'바퀴 '+(P.i+1)+'/'+P.list.length} · 😀 ${P.ok}</span></div>
    <div id="stage">${c.html}</div><div class="ctl">${c.say?'<button id="re">🔊 다시</button>':''}<button class="pri" id="go">${c.a?'👉 말했으면 정답 보기':'▶ 따라 했음 · 다음'}</button></div>`;
  if(c.say){say(c.say);$('#re').onclick=()=>say(c.say)}
  if(c.timer){const t0=Date.now();tm=setInterval(()=>{const e=$('#tm');e&&(e.textContent=Math.floor((Date.now()-t0)/1000))},250)}
  $('#go').onclick=c.a?()=>reveal(c):()=>{P.i++;show()};
}
function reveal(c){clearInterval(tm);const sec=$('#tm')&&$('#tm').textContent;
  $('#stage').className='ans';$('#stage').innerHTML=(sec?`<div class="ko">⏱ 내 답변 ${sec}초</div>`:'')+c.a;say(c.say2);
  $('.ctl').innerHTML='<button id="re">🔊</button><button id="no">😵 다시</button><button class="okb pri" id="yes">😀 됐다</button>';
  $('#re').onclick=()=>say(c.say2);
  $('#no').onclick=()=>{P.list.splice(Math.min(P.i+3,P.list.length),0,c);P.i++;show()}; // 틀린 카드는 3장 뒤에 다시
  $('#yes').onclick=()=>{P.ok++;if(c.k==='q'){S['ok'+c.qi]=(S['ok'+c.qi]||0)+1;save()}P.i++;show()};
}
// PC: 스페이스·엔터 = 파란 버튼, ← = 😵
document.addEventListener('keydown',e=>{if(!P)return;const b=e.key==='ArrowLeft'?$('#no'):(e.key===' '||e.key==='Enter')?$('.pri'):null;if(b){e.preventDefault();b.click()}});

// ───────── 첫 화면 ─────────
function home(){P=null;clearInterval(tm);speechSynthesis.cancel();
  const d=Math.ceil((new Date('2026-11-18T00:00:00+09:00')-Date.now())/864e5);
  app.innerHTML=`<h1>KAIST 면접 최종 대본 ${d<=0?'· 오늘!':''}</h1>
    <p class="tip">순서: ① → ② → ③ → ④ → ⑤ 한 바퀴씩, 그다음엔 ⑥만 계속. 반드시 <b>소리 내어</b> 말하고 정답을 보세요. 😵 누른 것은 3장 뒤에 다시 나옵니다.</p>
    <div class="chips">${['전체',...Q.map(q=>q.t)].map((t,i)=>`<button data-s="${i-1}" class="${scope()===i-1?'on':''}">${t}</button>`).join('')}</div>
    ${['listen','half','first','two','q'].map((k,i)=>`<button class="go" data-k="${k}"><b>${'①②③④⑤'[i]} ${M[k].t}</b><small>${M[k].d}</small></button>`).join('')}
    <button class="go p" data-k="mix"><b>⑥ 🔀 섞어서 무한 반복</b><small>절반·첫 단어·두 단어·실전 질문이 무작위로 · 면접 직전까지</small></button>
    <p class="tip">실전 ⑤ 성공: ${Q.map((q,i)=>`${q.t.slice(3)} ${S['ok'+i]||0}회`).join(' · ')}</p>
    <button class="go" id="sc"><b>📄 대본 보기·전체 듣기</b><small>문장을 누르면 읽어 줌 · 이동 중엔 이어 듣기</small></button>
    <label class="set">읽는 속도 <input id="rate" type="range" min="0.6" max="1.1" step="0.05" value="${rate()}"><span id="rv">${rate()}배</span></label>`;
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.scope=+b.dataset.s;save();home()});
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>start(b.dataset.k));
  $('#sc').onclick=script;
  $('#rate').oninput=e=>{S.rate=e.target.value;save();$('#rv').textContent=e.target.value+'배'};
}
// 대본: 문장을 누르면 그 문장, ▶ 이어 듣기는 처음부터 끝까지 반복
function script(){speechSynthesis.cancel();let chain=0;
  app.innerHTML=`<div class="top"><button id="back">←</button><b style="flex:1">최종 대본</b><button id="all">▶ 이어 듣기</button></div>
    ${Q.map(q=>`<div class="sc"><h3>${q.t}</h3><p data-say="${q.q}"><b>Q. ${q.q}</b><small>${q.qk}</small></p>${q.s.map(([en,ko])=>`<p data-say="${en.replace(/"/g,'&quot;')}">${en}<small>${ko}</small></p>`).join('')}</div>`).join('')}`;
  const ps=[...app.querySelectorAll('[data-say]')],btn=$('#all');
  const read=i=>{ps.forEach(x=>x.classList.remove('on'));const p=ps[i%ps.length];p.classList.add('on');chain&&p.scrollIntoView({block:'center',behavior:'smooth'});
    say(p.dataset.say,()=>{p.classList.remove('on');chain&&read(i+1)})};
  btn.onclick=()=>{chain=!chain;btn.textContent=chain?'⏹ 멈춤':'▶ 이어 듣기';chain?read(0):speechSynthesis.cancel()};
  ps.forEach((p,i)=>p.onclick=()=>{chain=0;btn.textContent='▶ 이어 듣기';read(i)});
  $('#back').onclick=home;
}
console.assert(showN('I am ok.',1)==='I <span class="m">··</span> <span class="m">··.</span>','showN');
console.assert(round('half').length===24&&round('q').length===3,'한 바퀴: 문장 24개, 질문 3개');
home();
</script>
</body>
</html>
