<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>KAIST 면접 최종 대본</title>
<style>
:root{color-scheme:dark;--bg:#12151b;--card:#1b2029;--fg:#e6e9ef;--mut:#98a2b3;--line:#2c3340;--acc:#6ea0ff;--ok:#4cc38a;--me:#12301f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 "Segoe UI","Malgun Gothic",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px;min-height:100dvh;display:flex;flex-direction:column}
button{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);cursor:pointer}
h1{font-size:19px;margin:4px 0 10px}
.tip{color:var(--mut);font-size:14px;margin:0 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}.chips button{padding:6px 12px;border-radius:99px;font-size:14px}.chips .on{background:var(--acc);border-color:var(--acc);color:#fff}
.go{display:block;width:100%;text-align:left;margin:6px 0;padding:14px}
.go b{display:block;font-size:17px}.go small{color:var(--mut)}
.go.p{background:var(--acc);border-color:var(--acc);color:#fff}.go.p small{color:#ffffffcc}
.top{display:flex;align-items:center;gap:10px}.top button{padding:6px 12px}
#tag{flex:1;font-size:13px;color:var(--mut)}
#stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:18px 14px;margin:10px 0;border-radius:18px;border:1px solid var(--line);background:var(--card);min-height:320px}
#stage.me{background:var(--me);border-color:var(--ok)}
.mic{height:6px;border-radius:9px;background:#fff1;overflow:hidden}.mic i{display:block;height:100%;width:0;background:var(--ok);transition:width .08s}
.ls .cur{color:var(--ok);font-weight:600}.ls .dim{opacity:.4}
#stage.ans{background:var(--me);border-color:var(--ok)}
.qk{color:var(--acc);font-weight:600}
.ko{color:var(--mut);font-size:15px}
.en{font-size:25px;line-height:1.4}
.ls{display:grid;gap:6px;font-size:19px;line-height:1.35}.ls small{display:block;color:var(--mut);font-size:13px}
.m{color:var(--mut);letter-spacing:1px}
.big{font-size:44px;text-align:center}
.timer{font-variant-numeric:tabular-nums;color:var(--ok);font-weight:600}
.ctl{display:flex;gap:8px;padding-bottom:env(safe-area-inset-bottom)}.ctl button{flex:1;font-size:18px;padding:16px 8px}
.pri{background:var(--acc);border-color:var(--acc);color:#fff}.okb{background:var(--ok);border-color:var(--ok);color:#fff}
.sc h3{margin:18px 0 4px;color:var(--acc);font-size:16px}
.sc p{margin:0;padding:7px 6px;border-radius:8px;cursor:pointer;font-size:18px}.sc p small{display:block;color:var(--mut);font-size:13px}.sc p.on{background:var(--me)}
.set{color:var(--mut);font-size:14px;margin-top:14px;display:flex;align-items:center;gap:8px}
details{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<main id="app"></main>
<script>
// ───────── 최종 대본 (사용자 원고, 2026-11-18) ─────────
const Q=[
{t:'1. 자기소개',q:'Could you please introduce yourself?',qk:'자기소개를 해 주시겠어요?',s:[
 ['Hello, my name is Park Junseong.','안녕하세요, 박준성입니다.'],
 ['Nice to meet you.','만나서 반갑습니다.'],
 ['I work on AI policy and strategy for Gimhae City.','김해시에서 AI 정책과 전략 일을 합니다.'],
 ['I studied economics and urban regeneration.','경제학과 도시재생학을 공부했습니다.'],
 ['Recently, I\'m very interested in AX.','요즘 AX에 관심이 많습니다.'],
 ['For me, AX means using AI to improve traditional industries and cities.','제게 AX는 AI로 전통 산업과 도시를 개선하는 것입니다.'],
 ['I came here from Gimhae today, I\'m ready to learn.','오늘 김해에서 왔고, 배울 준비가 되어 있습니다.'],
 ['I still have a lot to learn, and I\'m really excited about this opportunity.','아직 배울 게 많고, 이번 기회가 정말 설렙니다.'],
 ['I hope to do some good research here at KAIST.','이곳 KAIST에서 좋은 연구를 하고 싶습니다.'],
 ['Thank you for listening.','들어 주셔서 감사합니다.']]},
{t:'2. 지원 동기',q:'Why do you want to study at KAIST Future Strategy Graduate School?',qk:'왜 KAIST 미래전략대학원에서 공부하고 싶습니까?',s:[
 ['I learned one important thing from my work.','일하면서 중요한 것 하나를 배웠습니다.'],
 ['Technology, industry, and cities are connected.','기술, 산업, 도시는 연결되어 있습니다.'],
 ['But policies are often separated.','하지만 정책은 자주 따로 갑니다.'],
 ['I want to study them together.','이것들을 함께 공부하고 싶습니다.'],
 ['KAIST is a good place for that.','KAIST가 그러기에 좋은 곳입니다.'],
 ['And I want to use what I learn for my region.','그리고 배운 것을 우리 지역을 위해 쓰고 싶습니다.']]},
{t:'3. 연구 계획',q:'What do you want to study at KAIST?',qk:'KAIST에서 무엇을 공부하고 싶습니까?',s:[
 ['I want to study AI data centers in the southeast region — Busan, Ulsan, and Gyeongnam.','동남권, 즉 부산·울산·경남의 AI 데이터센터를 연구하고 싶습니다.'],
 ['They are not just digital infrastructure.','데이터센터는 단순한 디지털 인프라가 아닙니다.'],
 ['They use lots of power, water, and land, like a new factory.','새로운 공장처럼 전력, 물, 땅을 많이 씁니다.'],
 ['So I have three questions.','그래서 세 가지 질문이 있습니다.'],
 ['Is there enough power and water?','전력과 물이 충분한가?'],
 ['Is it safe from climate risk?','기후 위험에서 안전한가?'],
 ['And do local people benefit?','그리고 지역 주민이 혜택을 받는가?'], // 원고 "do that local people" → that 빼야 문법이 맞음
 ['My goal is to make a future guide for choosing best locations.','목표는 최적의 입지를 고르는 미래 가이드를 만드는 것입니다.']]}];

// ───────── 상태 ─────────
const $=s=>document.querySelector(s),app=$('#app');
const S=JSON.parse(localStorage.kaistFinal||'{}'),save=()=>localStorage.kaistFinal=JSON.stringify(S);
const scope=()=>S.scope==null?-1:S.scope; // -1 = 세 질문 전부
const qis=()=>scope()<0?[0,1,2]:[scope()];
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,r)=>p[0]-r[0]).map(x=>x[1]);
const sp=()=>S.slow?'s':'n'; // 녹음 속도: n 보통, s 느리게 (tools/build_audio.py로 만든 원어민 음성)
let CUE=null;fetch('audio/cues.json?v=3').then(r=>r.json()).then(j=>CUE=j); // 단어마다 시작 시각 → 앞 n단어만 재생
const W=en=>en.split(' ').filter(w=>w!=='—');
const showN=(en,n)=>{let i=0;return en.split(' ').map(w=>w==='—'||i++<n?w:`<span class="m">${w.replace(/[A-Za-z]/g,'·')}</span>`).join(' ')};
const ans1=([en,ko])=>`<div class="en">${en}</div><div class="ko">${ko}</div>`;
const ansAll=qi=>`<div class="qk">Q. ${Q[qi].q}</div><div class="ls">${Q[qi].s.map(([en,ko])=>`<div>${en}<small>${ko}</small></div>`).join('')}</div>`;

// ───────── 소리: 녹음 재생 + 말 끝 감지 ─────────
// 동작 하나 = next=>{}. halt()가 tok를 바꾸면 진행 중이던 동작은 모두 멈춤
const A=new Audio();let tok=0,raf,tmo,AC,an,buf,stream,micMsg='',wl;
function halt(){tok++;cancelAnimationFrame(raf);clearTimeout(tmo);A.pause();A.onended=null}
const seq=(acts,done)=>{const t=tok;let i=0;const go=()=>{if(t!==tok)return;i<acts.length?acts[i++](go):done()};go()};
const wait=ms=>next=>{tmo=setTimeout(next,ms)};
const view=h=>next=>{const e=$('#txt');e&&(e.innerHTML=h);next()};
function status(s,me){const e=$('#st');if(!e)return;e.textContent=s;$('#stage').className=me?'me':''}
// cut = 앞 cut단어만 재생하고 멈춤
const play=(qi,k,cut)=>next=>{const t=tok,end=cut&&CUE&&CUE[sp()][qi+'-'+k][cut]||1e9;let done=0;
  status('🔊 듣기');A.src=`audio/${sp()}/${qi}-${k}.mp3?v=3`; // v: 다시 녹음하면 올려야 옛 녹음 캐시를 안 씀
  const fin=()=>{if(done||t!==tok)return;done=1;cancelAnimationFrame(raf);A.pause();A.onended=null;next()};
  A.onended=fin;A.play().catch(()=>{tmo=setTimeout(fin,1500)});
  const chk=()=>{if(t!==tok)return;if(A.currentTime>=end-.04)return fin();raf=requestAnimationFrame(chk)};chk()};
// 말 끝 감지: 마이크 소리 크기만 봄(음성은 기기 밖으로 안 나감). 말이 끝나고 2초 조용하면 다음.
// 아예 말이 없으면 기다렸다가 넘어가고, 그 카드는 3장 뒤에 다시
const listen=(sec,card)=>next=>{const t=tok,t0=Date.now();status('🗣 말하세요'+(micMsg?' · '+micMsg:''),1);
  if(!an)return tmo=setTimeout(next,sec*1600+2000); // 마이크가 없으면 시간으로
  let floor=.01,spoke=0,quiet=0;
  const f=()=>{if(t!==tok)return;an.getFloatTimeDomainData(buf);let s=0;for(const x of buf)s+=x*x;const v=Math.sqrt(s/buf.length),now=Date.now(),b=$('#lv');
    b&&(b.style.width=Math.min(100,v*400)+'%');
    floor=v<floor?v:floor*.998+v*.002;
    if(now-t0>300&&v>Math.max(.015,floor*3)){spoke=spoke||now;quiet=now} // 처음 0.3초는 스피커 잔향이라 무시
    if(spoke&&quiet-spoke>300&&now-quiet>2000)return next();
    if(now-t0>(spoke?sec*2500+4000:Math.max(6000,sec*1200+3000))){if(!spoke)card.miss=1;return next()}
    raf=requestAnimationFrame(f)};f()};
function micOn(){if(an)return Promise.resolve();
  return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(st=>{stream=st;an=AC.createAnalyser();an.fftSize=1024;buf=new Float32Array(1024);AC.createMediaStreamSource(st).connect(an);micMsg=''})
    .catch(e=>{micMsg=e.name==='NotAllowedError'?'마이크 막힘 → 시간으로 넘김':'마이크 없음 → 시간으로 넘김'})}
function micOff(){stream&&stream.getTracks().forEach(t=>t.stop());stream=an=null}
const sec=en=>W(en).length*.55+1; // 내가 말하는 데 걸릴 시간(초) 어림

// ───────── 연습 방법 ─────────
// sent: 문장 단위 카드, 그 외: 답변 단위 카드
const twoV=(qi,j)=>`<div class="qk">Q. ${Q[qi].q}</div><div class="ls">${Q[qi].s.map(([en],m)=>`<div class="${m===j?'cur':m<j?'dim':''}">${showN(en,2)}</div>`).join('')}</div>`;
const M={
 book:{t:'📖 오디오북',d:'질문과 답변을 원어민 목소리로 계속 읽어 줌 · 듣기만',
   c:({qi})=>[view(ansAll(qi)),play(qi,0),wait(800),...Q[qi].s.flatMap((_,j)=>[play(qi,j+1),wait(350)]),wait(1500)]},
 listen:{t:'🎧 듣고 따라 하기',d:'한 문장 듣고 → 따라 말하기',sent:1,
   c:c=>{const x=Q[c.qi].s[c.j];return[view(ans1(x)),play(c.qi,c.j+1),listen(sec(x[0]),c),wait(300)]}},
 half:{t:'✂️ 문장 절반 듣고 말하기',d:'앞 절반만 들려줌 → 문장 전체 말하기 → 정답',sent:1,
   c:c=>{const x=Q[c.qi].s[c.j],n=Math.ceil(W(x[0]).length/2);return[view(`<div class="ko">${x[1]}</div><div class="en">${showN(x[0],n)}</div>`),play(c.qi,c.j+1,n),listen(sec(x[0]),c),view(ans1(x)),play(c.qi,c.j+1),wait(700)]}},
 first:{t:'1️⃣ 첫 단어만 듣고 말하기',d:'첫 단어만 들려줌 → 문장 전체 말하기 → 정답',sent:1,
   c:c=>{const x=Q[c.qi].s[c.j];return[view(`<div class="ko">${x[1]}</div><div class="en">${showN(x[0],1)}</div>`),play(c.qi,c.j+1,1),listen(sec(x[0]),c),view(ans1(x)),play(c.qi,c.j+1),wait(700)]}},
 two:{t:'✌️ 앞 두 단어 → 답변 전체',d:'질문 → 문장마다 앞 두 단어 듣고 이어 말하기 → 끝에 모범답안',
   c:c=>[play(c.qi,0),...Q[c.qi].s.flatMap(([en],j)=>[view(twoV(c.qi,j)),play(c.qi,j+1,2),listen(sec(en),c)]),view(ansAll(c.qi)),wait(500),...Q[c.qi].s.flatMap((_,j)=>[play(c.qi,j+1),wait(300)]),wait(1000)]},
 q:{t:'❓ 질문 듣고 답변 (실전)',d:'질문만 듣고 답변 전체 → 모범답안',
   c:c=>[view(`<div class="big">🎤</div><div class="qk" style="text-align:center">${Q[c.qi].q}</div>`),play(c.qi,0),listen(Q[c.qi].s.reduce((a,[en])=>a+sec(en),0),c),view(ansAll(c.qi)),...Q[c.qi].s.flatMap((_,j)=>[play(c.qi,j+1),wait(300)]),wait(1000)]}};
// 한 바퀴: 문장 카드는 순서대로(이어서 외우기), 답변 카드는 질문 순서를 섞음(오디오북은 순서대로)
const deck=k=>M[k].sent?qis().flatMap(qi=>Q[qi].s.map((_,j)=>({k,qi,j}))):(k==='book'?qis():shuffle(qis())).map(qi=>({k,qi}));
const mixOne=()=>{const k=shuffle(['half','first','two','q','q','two'])[0],qi=shuffle(qis())[0];return{k,qi,j:Math.random()*Q[qi].s.length|0}};

// ───────── 훈련 화면: 터치 없이 끝없이 돌아감 ─────────
let P=null;
function start(k){halt();AC=AC||new AudioContext();AC.resume(); // 버튼 누른 순간에 소리·마이크를 열어야 아이폰에서 동작
  A.src=`audio/${sp()}/0-0.mp3`;A.play().then(()=>A.pause()).catch(()=>{});
  navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wl=w).catch(()=>{});
  P={k,n:0,list:[],cur:null,paused:0};
  app.innerHTML=`<div class="top"><button id="x">✕</button><span id="tag">${k==='mix'?'🔀 섞어서':M[k].t}</span></div>
    <div id="stage"><div id="st" class="ko"></div><div class="mic"><i id="lv"></i></div><div id="txt"></div></div>
    <div class="ctl"><button id="pp">⏸ 멈춤</button><button id="sk">⏭ 다음</button></div>`;
  $('#x').onclick=home;
  $('#pp').onclick=()=>{P.paused=!P.paused;$('#pp').textContent=P.paused?'▶ 계속':'⏸ 멈춤';P.paused?(halt(),status('⏸ 멈춤')):runCard(P.cur)};
  $('#sk').onclick=()=>{P.paused=0;$('#pp').textContent='⏸ 멈춤';nextCard()};
  status('준비 중…');(k==='book'?Promise.resolve():micOn()).then(()=>P&&nextCard());
}
function nextCard(){halt();if(!P.list.length)P.list=P.k==='mix'?[mixOne()]:deck(P.k);P.n++;runCard(P.list.shift())}
function runCard(c){P.cur=c;c.miss=0;$('#tag').textContent=`${P.k==='mix'?'🔀 '+M[c.k].t:M[c.k].t} · ${Q[c.qi].t.slice(3)} · ${P.n}번째`;
  seq(M[c.k].c(c),()=>{if(c.miss&&c.k!=='book')P.list.splice(2,0,{k:c.k,qi:c.qi,j:c.j});nextCard()})} // 말이 없던 카드는 3장 뒤에 다시

// ───────── 첫 화면 ─────────
function home(){halt();P=null;micOff();wl&&wl.release();
  app.innerHTML=`<h1>KAIST 면접 최종 대본</h1>
    <p class="tip">🚗 <b>터치 없이 자동</b>: 들려주면 따라 말하고, 말이 끝나고 2초 조용하면 다음으로 넘어갑니다. 아무 말이 없으면 잠시 기다렸다 넘어가고 그 문장은 3장 뒤에 다시 나옵니다. <b>출발 전에 눌러 두고, 운전 중엔 화면을 보지 마세요.</b></p>
    <div class="chips">${['전체',...Q.map(q=>q.t)].map((t,i)=>`<button data-s="${i-1}" class="${scope()===i-1?'on':''}">${t}</button>`).join('')}</div>
    <div class="chips"><button data-v="0" class="${S.slow?'':'on'}">보통 속도</button><button data-v="1" class="${S.slow?'on':''}">🐢 느리게</button></div>
    ${['book','listen','half','first','two','q'].map((k,i)=>`<button class="go" data-k="${k}"><b>${'⓪①②③④⑤'[i]} ${M[k].t}</b><small>${M[k].d}</small></button>`).join('')}
    <button class="go p" data-k="mix"><b>⑥ 🔀 섞어서 무한 반복</b><small>절반·첫 단어·두 단어·실전 질문이 무작위로 · 면접 직전까지</small></button>
    <button class="go" id="sc"><b>📄 대본 보기</b><small>문장을 누르면 원어민 녹음 재생</small></button>`;
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.scope=+b.dataset.s;save();home()});
  app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.slow=+b.dataset.v;save();home()});
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>start(b.dataset.k));
  $('#sc').onclick=script;
}
function script(){halt();
  app.innerHTML=`<div class="top"><button id="back">←</button><b style="flex:1">최종 대본</b><button id="all">▶ 전체 듣기</button></div>
    ${Q.map((q,qi)=>`<div class="sc"><h3>${q.t}</h3><p data-c="${qi}-0"><b>Q. ${q.q}</b><small>${q.qk}</small></p>${q.s.map(([en,ko],j)=>`<p data-c="${qi}-${j+1}">${en}<small>${ko}</small></p>`).join('')}</div>`).join('')}`;
  // 문장을 누르면 그 문장만, ▶ 전체 듣기는 질문·답변을 처음부터 끝까지 계속 반복
  const ps=[...app.querySelectorAll('[data-c]')],btn=$('#all');let chain=0;
  const read=i=>{app.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));const p=ps[i%ps.length];p.classList.add('on');chain&&p.scrollIntoView({block:'center',behavior:'smooth'});
    const[qi,k]=p.dataset.c.split('-');play(qi,k)(()=>{p.classList.remove('on');if(chain)wait(k==='0'?800:350)(()=>read(i+1))})};
  btn.onclick=()=>{chain=!chain;btn.textContent=chain?'⏹ 멈춤':'▶ 전체 듣기';halt();
    if(chain){navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wl=w).catch(()=>{});read(0)}else app.querySelectorAll('.on').forEach(x=>x.classList.remove('on'))};
  ps.forEach((p,i)=>p.onclick=()=>{chain=0;btn.textContent='▶ 전체 듣기';halt();read(i)});
  $('#back').onclick=home;
}
console.assert(showN('I am ok.',1)==='I <span class="m">··</span> <span class="m">··.</span>'&&showN('a — b c',2).startsWith('a — b '),'showN: — 은 단어로 안 셈');
