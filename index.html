<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>KAIST 영어 면접 훈련</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c2330;--mut:#6b7585;--line:#dfe3ea;--acc:#1f5fd0;--ok:#12854a;--bad:#c8372d;--cur:#eaf1ff}
@media(prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--fg:#e6e9ef;--mut:#98a2b3;--line:#2c3340;--acc:#6ea0ff;--ok:#4cc38a;--bad:#ff7a70;--cur:#1f2b45}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "Segoe UI","Malgun Gothic",sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header b{font-size:17px}
header label{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}
main{max-width:820px;margin:0 auto;padding:16px}
button{font:inherit;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.on{background:var(--bad);border-color:var(--bad);color:#fff}
button.sel{border-color:var(--acc);color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .t{flex:1;min-width:180px}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.chip.g{border-color:var(--ok);color:var(--ok)}
h2{margin:8px 0 4px}h3{margin:22px 0 4px;font-size:15px;color:var(--mut)}
.q{font-size:18px;font-weight:600;margin:6px 0 0}
.ko{color:var(--mut);font-size:14px}
body.noko .ko{display:none}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
ol.sl{list-style:none;padding:0;margin:0}
ol.sl li{padding:10px 12px;border-radius:10px;border:1px solid transparent;cursor:pointer}
ol.sl li.cur{background:var(--cur);border-color:var(--acc)}
ol.sl li.ok .en::after{content:" ✓";color:var(--ok)}
.en{font-size:19px}
.script{font-size:19px;line-height:1.9}
.b{font-style:normal;color:var(--mut);letter-spacing:1px}
.hit{color:var(--ok)}.miss{color:var(--bad);text-decoration:underline}
.heard{color:var(--mut);font-size:14px;min-height:22px}
.big{font-size:28px;font-weight:700}
.timer{font-variant-numeric:tabular-nums;font-size:20px;font-weight:600}
audio{height:34px;vertical-align:middle}
.warn{background:#fff4d6;color:#6b4a00;border-radius:10px;padding:10px 14px;margin:10px 0}
kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:12px}
.act{position:sticky;bottom:0;z-index:1;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom));margin-bottom:0;border-top:1px solid var(--line)}
@media(pointer:coarse){kbd{display:none}button{min-height:46px}.act button{flex:1;font-size:17px;padding:12px 8px}}
@media(max-width:600px){main{padding:10px}header{padding:8px 10px;gap:8px}header b{font-size:15px}#rate{width:90px}
 .row .t{flex-basis:100%}.row>button{flex:1}.en,.script{font-size:18px}.q{font-size:17px}h2{font-size:20px}}
</style>
</head>
<body>
<header>
  <b>KAIST 영어 면접 훈련</b><span id="dday" class="chip"></span>
  <label>읽는 속도 <input id="rate" type="range" min="0.6" max="1.1" step="0.05"><span id="rv"></span></label>
  <label><input id="koT" type="checkbox" checked> 한글 뜻</label>
</header>
<main id="app"></main>
<script>
// ───────── 질문·원고 (여기만 고치면 됨) ─────────
// s: [영어 문장, 한글 뜻] / kw: 키워드 단계에서 보여줄 단서 / star: 꼭 외울 질문
const DAYS=['11/14 (토)','11/15 (일)','11/16 (월)','11/17 (화)'];
const Q=[
{id:'intro',day:0,star:1,t:'자기소개',q:'Please introduce yourself.',qk:'자기소개를 해 주세요.',
 kw:['my name','Gimhae City','economics · urban regeneration','AI policy','AX','power semiconductors','connect','my main question','KAIST'],
 s:[['Hello. It is nice to meet you.','안녕하세요. 만나서 반갑습니다.'],
 ['My name is Park Junseong.','제 이름은 박준성입니다.'],
 ['I work for Gimhae City in Korea.','저는 한국의 김해시에서 일하고 있습니다.'],
 ['I studied economics and urban regeneration.','경제학과 도시재생을 공부했습니다.'],
 ['Now I work on AI policy and future industries.','현재는 AI 정책과 미래산업 일을 하고 있습니다.'],
 ['I am very interested in how AI can change traditional industries.','AI가 기존 산업을 어떻게 바꿀 수 있는지에 관심이 많습니다.'],
 ['I call this AX.','저는 이것을 AX라고 부릅니다.'],
 ['Recently, I have been working on power semiconductor cooperation.','최근에는 전력반도체 협력을 추진하고 있습니다.'],
 ['It connects Ulsan and the southeast region of Korea.','울산과 동남권을 잇는 일입니다.'],
 ['I think power semiconductors are very important.','저는 전력반도체가 매우 중요하다고 생각합니다.'],
 ['They are a key technology for AI data centers, physical AI, and next-generation chips.','AI 데이터센터, 피지컬 AI, 차세대 반도체의 핵심기술입니다.'],
 ['They can also help industries like cars and shipbuilding.','자동차와 조선 같은 산업에도 도움이 됩니다.'],
 ['I want to connect universities, research institutes, and companies.','대학, 연구기관, 기업을 연결하고 싶습니다.'],
 ['My main question is this.','제가 중요하게 생각하는 질문은 이것입니다.'],
 ['How can we use new technology to grow our industries and improve people\'s lives?','새 기술을 어떻게 써야 산업을 키우고 사람들의 삶을 낫게 할 수 있을까요?'],
 ['This is why I want to study at KAIST.','이것이 제가 KAIST에서 공부하고 싶은 이유입니다.'],
 ['I want to learn more about the future of technology, industry, and cities.','기술과 산업, 도시의 미래를 더 깊이 배우고 싶습니다.'],
 ['Thank you.','감사합니다.']]},
{id:'why',day:0,star:1,t:'지원 동기',q:'Why did you apply to the Graduate School of Future Strategy?',qk:'왜 미래전략대학원에 지원했습니까?',
 kw:['all connected','policies divided','one field alone','study together','city planning + technology policy','possible futures','best place'],
 s:[['In my work, I learned one thing.','일을 하면서 한 가지를 배웠습니다.'],
 ['Industry, cities, and people\'s lives are all connected.','산업과 도시, 사람들의 삶은 모두 연결되어 있습니다.'],
 ['But policies are divided into separate fields.','하지만 정책은 분야별로 나뉘어 있습니다.'],
 ['One field alone cannot explain how a region changes.','한 분야만으로는 지역의 변화를 설명할 수 없습니다.'],
 ['So I want to study technology, industry, and cities together.','그래서 기술과 산업, 도시를 함께 공부하고 싶습니다.'],
 ['At this school, I can study future city planning and technology policy together.','이 대학원에서는 미래도시계획과 기술정책을 함께 공부할 수 있습니다.'],
 ['I also want to learn how to explore many possible futures.','여러 가능한 미래를 탐색하는 방법도 배우고 싶습니다.'],
 ['That is why this school is the best place for me.','그래서 이곳이 저에게 가장 맞는 곳입니다.']]},
{id:'master',day:0,star:1,t:'박사인데 왜 석사?',q:'You already have a PhD. Why do you want another master\'s degree?',qk:'이미 박사학위가 있는데 왜 석사과정에 지원했습니까?',
 kw:['fair question','PhD: economic risk','today: AI · new industries','changing fast','not enough','new tools','degree is not the goal','new way of thinking'],
 s:[['That is a fair question.','당연히 하실 수 있는 질문입니다.'],
 ['In my PhD, I studied economic risk in local areas.','박사과정에서는 지역의 경제적 위험을 연구했습니다.'],
 ['But my work today is about AI and new industries.','하지만 지금 제 일은 AI와 새로운 산업에 관한 것입니다.'],
 ['Technology is changing our regions very fast.','기술이 지역을 아주 빠르게 바꾸고 있습니다.'],
 ['My old knowledge is not enough to understand this change.','기존 지식만으로는 이 변화를 이해하기에 부족합니다.'],
 ['I need new tools, such as future studies and technology policy.','미래학과 기술정책 같은 새로운 도구가 필요합니다.'],
 ['For me, the degree is not the goal.','저에게 학위는 목표가 아닙니다.'],
 ['I am here to learn a new way of thinking.','새로운 사고방식을 배우러 왔습니다.']]},
{id:'survive',day:0,star:1,nomock:1,t:'생존 표현 (못 알아들었을 때)',q:'Useful phrases',qk:'질문을 못 알아듣거나 막혔을 때 쓰는 말. 입에 붙을 때까지.',
 kw:['repeat','slowly','let me think','are you asking about','not sure, but','say that again','want to learn','thank you'],
 s:[['I am sorry. Could you repeat the question, please?','죄송합니다. 질문을 다시 말씀해 주시겠어요?'],
 ['Could you speak a little more slowly, please?','조금만 천천히 말씀해 주시겠어요?'],
 ['Let me think for a moment.','잠시 생각해 보겠습니다.'],
 ['Let me check. Are you asking about my research plan?','확인하겠습니다. 제 연구계획을 물으시는 건가요?'],
 ['That is a good question.','좋은 질문입니다.'],
 ['I am not sure, but I will try to answer.','확실하지 않지만 답변해 보겠습니다.'],
 ['I am sorry. Let me say that again.','죄송합니다. 다시 말씀드리겠습니다.'],
 ['I do not know much about that, but I want to learn it at KAIST.','그 부분은 잘 모르지만 KAIST에서 배우고 싶습니다.'],
 ['Thank you for your time.','시간 내 주셔서 감사합니다.']]},
{id:'research',day:1,star:1,t:'박사 연구 소개',q:'Please tell us about your previous research.',qk:'이전 연구를 소개해 주세요.',
 kw:['high risk of suicide','economic factors','economy · population · housing · space','same city, different risk','not only personal','local economy','National Assembly Research Service'],
 s:[['In my PhD, I studied areas with a high risk of suicide.','박사과정에서 자살 고위험 지역을 연구했습니다.'],
 ['I focused on economic factors.','경제적 요인에 초점을 두었습니다.'],
 ['I looked at the economy, population, housing, and space of each living area.','생활권별로 경제, 인구, 주거, 공간 특성을 살펴봤습니다.'],
 ['I found one important thing.','중요한 점 하나를 발견했습니다.'],
 ['Even in the same city, the risk is very different from area to area.','같은 도시 안에서도 지역마다 위험이 크게 다릅니다.'],
 ['In industrial cities, the problem is not only personal.','산업도시에서는 그 문제가 개인만의 문제가 아닙니다.'],
 ['It comes from the local economy and the living environment.','지역의 경제구조와 생활환경에서 비롯됩니다.'],
 ['Based on this research, I proposed a policy to the National Assembly Research Service.','이 연구를 바탕으로 국회입법조사처에 정책을 제안했습니다.']]},
{id:'study',day:1,star:1,t:'학업 계획',q:'What do you want to study at KAIST?',qk:'KAIST에서 무엇을 공부하고 싶습니까?',
 kw:['one main question','technology → industry · cities · society','region respond','old manufacturing cities','aging parks · workers','not replace','connect strengths','southeast region','compare futures'],
 s:[['I want to study one main question.','한 가지 핵심 질문을 연구하고 싶습니다.'],
 ['How does new technology change industry, cities, and society?','새로운 기술은 산업과 도시, 사회를 어떻게 바꾸는가?'],
 ['And how should a region respond to this change?','그리고 지역은 이 변화에 어떻게 대응해야 하는가?'],
 ['I will focus on old manufacturing cities.','오래된 제조업 도시에 집중하겠습니다.'],
 ['These cities have aging industrial parks and aging workers.','이 도시들은 산업단지가 낡고 인력이 고령화되고 있습니다.'],
 ['I do not want to simply replace old industries.','기존 산업을 단순히 대체하고 싶지 않습니다.'],
 ['I want to connect their strengths with new technology.','그 강점을 새로운 기술과 연결하고 싶습니다.'],
 ['My target area is the southeast region of Korea.','연구 대상은 동남권입니다.'],
 ['I want to compare different possible futures and find the best strategy.','여러 가능한 미래를 비교해 가장 좋은 전략을 찾고 싶습니다.']]},
{id:'after',day:1,star:1,t:'졸업 후 계획',q:'What is your plan after graduation?',qk:'졸업 후 계획은 무엇입니까?',
 kw:['continue to work','apply research','companies · universities · institutes','accept the future','change that','choose their own','real policy'],
 s:[['After graduation, I will continue to work for my region.','졸업 후에도 계속 지역을 위해 일하겠습니다.'],
 ['I will apply my research to local industrial and urban policy.','연구 결과를 지역의 산업·도시정책에 적용하겠습니다.'],
 ['I will work with companies, universities, and research institutes.','기업, 대학, 연구기관과 함께 일하겠습니다.'],
 ['Many regions just accept the future that is given to them.','많은 지역이 주어진 미래를 그냥 받아들입니다.'],
 ['I want to change that.','저는 그것을 바꾸고 싶습니다.'],
 ['I want to help regions compare different futures and choose their own.','지역이 여러 미래를 비교하고 스스로 선택하도록 돕고 싶습니다.'],
 ['My goal is to turn new possibilities into real policy.','제 목표는 새로운 가능성을 실제 정책으로 만드는 것입니다.']]},
{id:'achieve',day:1,t:'업무 성과',q:'What is your biggest achievement at work?',qk:'직장에서 가장 큰 성과는 무엇입니까?',
 kw:['AI Innovation Platform','study group','Task Force','tested','built by ourselves','no outside companies · extra budget','award'],
 s:[['My biggest achievement is the Gimhae AI Innovation Platform.','가장 큰 성과는 김해 AI 혁신 플랫폼입니다.'],
 ['First, I ran an AI study group with my coworkers.','먼저 동료들과 AI 연구모임을 운영했습니다.'],
 ['Then we started the AI Innovation Task Force.','그다음 AI혁신TF를 출범시켰습니다.'],
 ['We tested how AI can help public service.','AI가 행정에 어떻게 도움이 되는지 실험했습니다.'],
 ['Then we built the platform by ourselves.','그리고 플랫폼을 우리 손으로 직접 만들었습니다.'],
 ['We did not use outside companies or extra budget.','외부 용역이나 추가 예산을 쓰지 않았습니다.'],
 ['For this work, we received an award from the Minister of the Interior and Safety.','이 일로 행정안전부 장관상을 받았습니다.']]},
{id:'closing',day:1,t:'마지막 한마디',q:'Do you have any last words?',qk:'마지막으로 하고 싶은 말이 있습니까?',
 kw:['opportunity','learned from the field','study more deeply','bring back','thank you'],
 s:[['Thank you for this opportunity.','이런 기회를 주셔서 감사합니다.'],
 ['I have learned a lot from the field.','저는 현장에서 많은 것을 배웠습니다.'],
 ['Now I want to study more deeply at KAIST.','이제 KAIST에서 더 깊이 공부하고 싶습니다.'],
 ['I will bring what I learn back to my region.','배운 것을 다시 지역으로 가져가겠습니다.'],
 ['Thank you for listening.','들어 주셔서 감사합니다.']]},
{id:'ax',day:2,t:'AX란?',q:'What is AX? Can you explain it simply?',qk:'AX가 무엇인지 쉽게 설명해 주세요.',
 kw:['AI transformation','how an industry works','not just software','production · products · jobs','shipbuilding · machinery · cars','not only factories','whole region'],
 s:[['AX means AI transformation.','AX는 AI 전환을 뜻합니다.'],
 ['It means using AI to change how an industry works.','AI로 산업이 일하는 방식을 바꾸는 것입니다.'],
 ['It is not just buying new software.','단순히 새 소프트웨어를 사는 것이 아닙니다.'],
 ['It changes production, products, and jobs.','생산방식과 제품, 일자리를 바꿉니다.'],
 ['For example, shipbuilding, machinery, and car factories can use AI.','예를 들어 조선, 기계, 자동차 공장이 AI를 쓸 수 있습니다.'],
 ['But AX is not only about factories.','하지만 AX는 공장만의 이야기가 아닙니다.'],
 ['It also changes education, housing, and the city itself.','교육과 주거, 도시 자체도 바꿉니다.'],
 ['So I believe AX is an issue for the whole region.','그래서 AX는 지역 전체의 문제라고 생각합니다.']]},
{id:'power',day:2,t:'전력반도체',q:'Why are power semiconductors important?',qk:'전력반도체는 왜 중요합니까?',
 kw:['control and convert electricity','AI needs electricity','data centers','electric cars · ships · robots','AI era','southeast: cars · shipbuilding','good chance','connect universities','new growth path'],
 s:[['Power semiconductors control and convert electricity.','전력반도체는 전기를 제어하고 변환합니다.'],
 ['AI needs a lot of electricity.','AI는 전기를 아주 많이 씁니다.'],
 ['So AI data centers need better power semiconductors.','그래서 AI 데이터센터에는 더 좋은 전력반도체가 필요합니다.'],
 ['Electric cars, ships, and robots need them too.','전기차, 선박, 로봇에도 필요합니다.'],
 ['That is why they are a key technology for the AI era.','그래서 AI 시대의 핵심기술입니다.'],
 ['The southeast region has strong car and shipbuilding industries.','동남권은 자동차와 조선 산업이 강합니다.'],
 ['So this region has a good chance.','그래서 이 지역에 좋은 기회가 있습니다.'],
 ['I am working to connect UNIST, Pusan National University, and Inje University.','UNIST, 부산대, 인제대를 연결하는 일을 하고 있습니다.'],
 ['Together, the region can build a new growth path.','함께하면 지역이 새로운 성장경로를 만들 수 있습니다.']]},
{id:'leader',day:2,t:'리더십 사례',q:'Tell us about a time you showed leadership.',qk:'리더십을 발휘한 사례를 말해 주세요.',
 kw:['AI WAVE Committee','partners outside city hall','visited','not easy','different interests','met in person','trust','launched','not just good intentions'],
 s:[['I will tell you about the Nakdong River AI WAVE Committee.','낙동강 AI WAVE 위원회를 말씀드리겠습니다.'],
 ['AI transformation needs partners outside city hall.','AI 전환에는 시청 밖의 파트너가 필요합니다.'],

// ───────── 상태 ─────────
const $=s=>document.querySelector(s), app=$('#app');
const S=JSON.parse(localStorage.kaistInterview||'{}');
const save=()=>localStorage.kaistInterview=JSON.stringify(S);
const st=id=>S[id]||(S[id]={sh:0,r:{},m:0});
const full=q=>q.s.map(x=>x[0]).join(' ');
const LV=[[.3,'30% 가림'],[.6,'60% 가림'],[.9,'90% 가림'],[1,'키워드만']];

// ───────── 채점: 원고 단어를 몇 개 말했나 (순서 무시) ─────────
// ponytail: 단어 주머니 비교. 순서까지 보려면 LCS로 바꾸면 됨.
const NUM={0:'zero',1:'one',2:'two',3:'three',4:'four',5:'five',10:'ten'};
const FREE=new Set(['kaist','gimhae','unist','ax','nakdong','ulsan','inje','pusan','wave','phd','park','junseong']); // 음성인식이 못 잡는 고유명사는 채점 제외
const norm=s=>s.toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean).map(w=>NUM[w]||w);
function grade(script,heard){
  const bag={};norm(heard).forEach(w=>bag[w]=(bag[w]||0)+1);
  let ok=0,n=0;
  const marks=script.split(/\s+/).map(tok=>{
    const ws=norm(tok);if(!ws.length)return[tok,true];
    n++;const hit=ws.every(w=>FREE.has(w)||bag[w]>0);
    if(hit){ws.forEach(w=>{if(!FREE.has(w))bag[w]--});ok++}
    return[tok,hit]});
  return{pct:n?Math.round(ok/n*100):0,marks};
}
const paint=m=>m.map(([t,h])=>`<span class="${h?'hit':'miss'}">${t}</span>`).join(' ');
console.assert(grade('I work for Gimhae City.','i work for city').pct===100,'grade: 고유명사 제외');
console.assert(grade('Hello there','hello').pct===50,'grade: 절반');
console.assert(grade('the the','the').pct===50,'grade: 중복 단어');

// ───────── 읽어주기 (TTS) ─────────
let sayId=0;
function say(list,onend){
  speechSynthesis.cancel();const id=++sayId;
  const vs=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('en'));
  const voice=vs.find(v=>v.lang==='en-US'&&/Google|Natural|Aria|Jenny/.test(v.name))||vs.find(v=>v.lang==='en-US')||vs[0];
  [].concat(list).forEach((t,i,a)=>{
    const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=+$('#rate').value;
    if(i===a.length-1)u.onend=()=>{if(id===sayId&&onend)onend()};
    speechSynthesis.speak(u)});
}
speechSynthesis.getVoices(); // 목록 미리 불러오기

// ───────── 받아쓰기 (음성인식) + 녹음 ─────────
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec,recOn=false,recText='',t0=0,mr,chunks=[],stream,tm;
const MOB=matchMedia('(pointer:coarse)').matches;
// onquit: 침묵으로 인식이 끊기면 다시 켜지 않고 알림 (모바일 따라 말하기용 — 재시작마다 삑 소리가 나서)
function listen(onupdate,onquit){
  if(!SR)return alert('이 브라우저는 음성인식이 안 됩니다. 크롬(안드로이드)이나 사파리(아이폰)로 열어 주세요.');
  recText='';let base='',sess='';rec=new SR();rec.lang='en-US';rec.interimResults=true;
  rec.continuous=!MOB; // 안드로이드 크롬은 continuous에서 결과가 중복됨 → 한 호흡씩 받고 이어 붙임
  rec.onresult=e=>{const rs=[...e.results].map(r=>r[0].transcript);sess=MOB?rs[rs.length-1]:rs.join(' ');recText=base+sess;onupdate&&onupdate(recText)};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){recOn=false;alert('마이크 권한을 허용해 주세요.')}};
  rec.onend=()=>{base+=sess+' ';sess='';if(!recOn)return;if(onquit){recOn=false;onquit()}else try{rec.start()}catch(_){}}; // 침묵이 길면 저절로 끊김 → 다시 켬
  recOn=true;t0=Date.now();rec.start();
}
function unlisten(){recOn=false;try{rec&&rec.stop()}catch(_){}return recText}
async function tape(){
  if(MOB)return mr=null; // ponytail: 모바일은 인식과 녹음이 마이크를 두고 충돌 → 녹음 생략. 필요하면 인식 끄는 '녹음만' 모드 추가
  try{stream=stream||await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];mr=new MediaRecorder(stream);mr.ondataavailable=e=>chunks.push(e.data);mr.start()}catch(_){mr=null}
}
function untape(cb){if(!mr||mr.state==='inactive')return;mr.onstop=()=>cb(URL.createObjectURL(new Blob(chunks,{type:mr.mimeType})));mr.stop()}
function clock(el){clearInterval(tm);tm=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`},250)}
let lt;const later=(f,ms)=>{clearTimeout(lt);lt=setTimeout(f,ms)}; // 화면을 떠나면 halt()가 취소
function halt(){clearTimeout(lt);sayId++;speechSynthesis.cancel();if(recOn)unlisten();clearInterval(tm);if(mr&&mr.state!=='inactive'){mr.onstop=null;mr.stop()}document.onkeydown=null}

// ───────── 목록 ─────────
function home(){
  halt();
  const best=q=>{const r=st(q.id).r;const top=LV.filter(([l])=>(r[l]||0)>=80).pop();return top?top[1]+' 통과':'—'};
  const chip=(txt,g)=>`<span class="chip ${g?'g':''}">${txt}</span>`;
  app.innerHTML=(SR?'':'<div class="warn">이 브라우저는 음성인식을 지원하지 않습니다. 카카오톡 등 앱 안 브라우저면 <b>크롬(안드로이드) 또는 사파리(아이폰)</b>로 다시 열어 주세요.</div>')
   +`<div class="card row"><div class="t"><b>실전 모의면접</b><div class="ko">질문 5개를 소리로만 듣고 답합니다. 약한 질문이 먼저 나옵니다.</div></div><button class="p" onclick="mock()">시작</button></div>`
   +DAYS.map((d,i)=>`<h3>${i+1}일차 · ${d}${i===3?' — 새 질문 없음. 모의면접 3회 + 점수 낮은 질문 복습':''}</h3>`
     +Q.filter(q=>q.day===i).map(q=>{const s=st(q.id);return`<div class="card row"><div class="t"><b>${q.star?'★ ':''}${q.t}</b><div class="ko" style="display:block">${q.q}</div></div>
       ${chip('따라 '+s.sh+'%',s.sh>=100)}${chip('가리기 '+best(q),best(q)!=='—')}${q.nomock?'':chip('실전 '+s.m+'%',s.m>=70)}
       <button onclick="shadow('${q.id}')">① 따라 말하기</button><button onclick="recall('${q.id}')">② 가리고 말하기</button></div>`}).join('')).join('')
   +`<p class="ko" style="display:block">★ = 꼭 나올 질문. 순서: ① 문장마다 듣고 따라 하기 → ② 가림 30% → 60% → 90% → 키워드만 → 실전. 각 단계 80% 넘으면 다음으로.</p>`;
}
const head=(q,mode)=>`<div class="bar"><button onclick="home()">← 목록</button>
  <button class="${mode==='sh'?'sel':''}" onclick="shadow('${q.id}')">① 따라 말하기</button><button class="${mode==='re'?'sel':''}" onclick="recall('${q.id}')">② 가리고 말하기</button></div>
  <h2>${q.t}</h2><p class="q">Q. ${q.q}</p><p class="ko">${q.qk}</p>`;

// ───────── ① 따라 말하기: 한 문장 듣고 → 따라 말하고 → 80% 넘으면 다음 문장 ─────────
function shadow(id){
  halt();const q=Q.find(x=>x.id===id),pass=q.s.map(()=>false);let i=0;
  app.innerHTML=head(q,'sh')+`<label class="ko" style="display:block"><input id="au" type="checkbox" checked> 자동 진행 (듣기 → 말하기 → 다음 문장)</label>
    <ol class="sl">${q.s.map((s,k)=>`<li data-k="${k}"><div class="en">${s[0]}</div><div class="ko">${s[1]}</div></li>`).join('')}</ol>
    <div class="act"><p id="heard" class="heard"></p><div class="bar" style="margin:0"><button id="bL">▶ 듣기 <kbd>Space</kbd></button><button id="bS" class="p">🎤 말하기 <kbd>Enter</kbd></button><button id="bN">다음 <kbd>→</kbd></button></div></div>`;
  const li=k=>app.querySelector(`li[data-k="${k}"]`),bS=$('#bS'),heard=$('#heard');
  const mark=()=>{app.querySelectorAll('li').forEach((e,k)=>{e.classList.toggle('cur',k===i);e.classList.toggle('ok',pass[k])});li(i).scrollIntoView({block:'center',behavior:'smooth'})};
  const stop=()=>{unlisten();bS.classList.remove('on');bS.innerHTML='🎤 말하기 <kbd>Enter</kbd>'};
  const play=()=>{if(recOn)stop();say(q.s[i][0],()=>$('#au')&&$('#au').checked&&speak())};
  const go=k=>{if(recOn)stop();i=(k+q.s.length)%q.s.length;li(i).querySelector('.en').textContent=q.s[i][0];heard.textContent='';mark();play()};
  function speak(){
    if(recOn)return stop();
    sayId++;speechSynthesis.cancel();bS.classList.add('on');bS.innerHTML='■ 정지 <kbd>Enter</kbd>';
    listen(txt=>{const g=grade(q.s[i][0],txt);li(i).querySelector('.en').innerHTML=paint(g.marks);heard.textContent='들린 말: '+txt+'  ('+g.pct+'%)';
      if(g.pct>=80&&recOn){stop();pass[i]=true;const s=st(id);s.sh=Math.max(s.sh,Math.round(pass.filter(Boolean).length/pass.length*100));save();mark();
        if(pass.every(Boolean))heard.textContent='모든 문장 통과. ② 가리고 말하기로 넘어가세요.';
        else if($('#au').checked)later(()=>go(i+1),500)}},MOB&&stop);
  }
  $('#bL').onclick=play;bS.onclick=speak;$('#bN').onclick=()=>go(i+1);
  app.querySelectorAll('li').forEach(e=>e.onclick=()=>go(+e.dataset.k));
  document.onkeydown=e=>{if(e.code==='Space'){e.preventDefault();play()}else if(e.code==='Enter'){e.preventDefault();speak()}else if(e.code==='ArrowRight')go(i+1);else if(e.code==='ArrowLeft')go(i-1)};
  mark();
}

// ───────── ② 가리고 말하기: 답변 전체를 가림 수준별로 ─────────
const blank=(sent,lv)=>sent.split(' ').map((w,j)=>(j>0||lv>=.9)&&Math.random()<lv?`<i class="b">${w.replace(/[A-Za-z0-9]/g,'_')}</i>`:w).join(' ');
function result(q,text,sec,url){
  const g=grade(full(q),text),wpm=sec?Math.round(norm(text).length/sec*60):0;
  return{g,html:`<div class="row"><span class="big">${g.pct}%</span><span class="chip">${Math.round(sec)}초</span><span class="chip">분당 ${wpm}단어 (목표 100~130)</span>${url?`<audio controls src="${url}"></audio>`:''}</div>
    <p class="script">${paint(g.marks)}</p><p class="heard">들린 말: ${text.replace(/</g,'&lt;')||'(없음)'}</p>`};
}
function recall(id,lv){
  halt();const q=Q.find(x=>x.id===id),s=st(id);
  if(!lv)lv=(LV.find(([l])=>(s.r[l]||0)<80)||LV[3])[0]; // 아직 못 넘은 단계부터
  const goal=Math.round(norm(full(q)).length/110*60);
  app.innerHTML=head(q,'re')+`<div class="bar">${LV.map(([l,n])=>`<button class="${l===lv?'sel':''}" onclick="recall('${id}',${l})">${n}${(s.r[l]||0)>=80?' ✓':''}</button>`).join('')}</div>
    <div class="card"><div class="script">${lv===1?q.kw.map(k=>`<span class="chip" style="font-size:16px">${k}</span>`).join(' '):q.s.map(x=>blank(x[0],lv)).join('<br>')}</div></div>
    <div class="bar"><button id="bL">▶ 모범답안 듣기</button><button onclick="recall('${id}',${lv})">가림 다시 섞기</button><span class="chip">목표 약 ${goal}초</span></div><div id="out"></div>
    <div class="act bar"><span id="tm" class="timer">0:00</span><button id="bS" class="p">🎤 답변 시작 <kbd>Enter</kbd></button></div>`;
  const bS=$('#bS');
  $('#bL').onclick=()=>say(q.s.map(x=>x[0]));
  bS.onclick=()=>{
    if(!recOn){sayId++;speechSynthesis.cancel();$('#out').innerHTML='';bS.classList.add('on');bS.innerHTML='■ 답변 끝 <kbd>Enter</kbd>';tape();listen();clock($('#tm'));return}
    const sec=(Date.now()-t0)/1000,text=unlisten();clearInterval(tm);bS.classList.remove('on');bS.innerHTML='🎤 다시 답변 <kbd>Enter</kbd>';
    const show=url=>{const r=result(q,text,sec,url);$('#out').innerHTML=r.html+(r.g.pct>=80?'<p class="hit">통과. 다음 가림 단계로 올리세요.</p>':'<p>80%가 넘으면 통과. 빨간 단어를 확인하고 다시.</p>');
      s.r[lv]=Math.max(s.r[lv]||0,r.g.pct);save()};
    mr&&mr.state!=='inactive'?untape(show):show();
  };
  document.onkeydown=e=>{if(e.code==='Enter'){e.preventDefault();bS.click()}};
}

// ───────── ③ 실전: 자기소개 + 점수 낮은 질문 4개, 질문은 소리로만 ─────────
function mock(){
  halt();
  const key=q=>Math.max(0,st(q.id).m,...Object.values(st(q.id).r))+Math.random()*30;
  const pool=Q.filter(q=>!q.nomock&&q.id!=='intro').map(q=>[key(q),q]).sort((a,b)=>a[0]-b[0]).slice(0,4).map(x=>x[1]);
  const set=[Q[0],...pool],res=[],start=Date.now();let i=0;
  function ask(){
    const q=set[i];
    app.innerHTML=`<div class="bar"><button onclick="home()">← 그만</button><span class="chip">전체 ${Math.floor((Date.now()-start)/60000)}분 경과</span></div>
      <h2>질문 ${i+1} / ${set.length}</h2><p class="q" id="qt">🔊 질문을 듣고 답하세요</p>
      <div class="bar"><button id="bR">질문 다시 듣기</button><button id="bV">질문 글자로 보기</button></div>
      <p class="ko" style="display:block">질문이 끝나면 자동으로 듣기 시작합니다. 타이머가 안 움직이면 [답변 시작]을 누르세요.</p>
      <div class="act bar"><span id="tm" class="timer">0:00</span><button id="bB">🎤 답변 시작</button><button id="bE" class="p" disabled>답변 끝 → <kbd>Enter</kbd></button></div>`;
    const begin=()=>{if(recOn)return;sayId++;speechSynthesis.cancel();tape();listen();clock($('#tm'));$('#bE').disabled=false;$('#bB').disabled=true};$('#bB').onclick=begin;
    $('#bR').onclick=()=>say(q.q,begin);$('#bV').onclick=()=>$('#qt').textContent='Q. '+q.q;
    $('#bE').onclick=()=>{const sec=(Date.now()-t0)/1000,text=unlisten();clearInterval(tm);
      const next=url=>{res.push({q,text,sec,url});++i<set.length?ask():done()};mr&&mr.state!=='inactive'?untape(next):next()};
    document.onkeydown=e=>{if(e.code==='Enter'&&!$('#bE').disabled){e.preventDefault();$('#bE').click()}};
    say(q.q,begin);
  }
  function done(){
    halt();let sum=0;
    const rows=res.map(r=>{const o=result(r.q,r.text,r.sec,r.url),s=st(r.q.id);s.m=Math.max(s.m,o.g.pct);sum+=o.g.pct;
      return`<details class="card"><summary><b>${r.q.t}</b> — ${o.g.pct}% · ${Math.round(r.sec)}초</summary><p class="ko">Q. ${r.q.q}</p>${o.html}</details>`}).join('');
    save();
    app.innerHTML=`<div class="bar"><button onclick="home()">← 목록</button><button class="p" onclick="mock()">한 번 더</button></div>
      <h2>모의면접 결과</h2><p><span class="big">평균 ${Math.round(sum/res.length)}%</span> · 총 ${Math.round((Date.now()-start)/60000)}분</p>${rows}
      <p class="ko" style="display:block">원고와 똑같이 말할 필요는 없습니다. 70% 이상이면 내용이 전달된 것입니다.</p>`;
  }
  ask();
}
